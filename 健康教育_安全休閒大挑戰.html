r:#24a16d;background:#ecfbf3}.choice.wrong{border-color:#c76a6a;background:#fff0f0}.choice .pic{width:100%;height:115px;border-radius:13px;display:flex;justify-content:center;align-items:center;font-size:clamp(47px,7vw,74px);background:linear-gradient(#e0f5ff 55%,#dff2d8 55%);position:relative;overflow:hidden}.choice .pic span{z-index:1;filter:drop-shadow(0 4px 2px #16364e19)}.choice strong{font-size:clamp(17px,2.3vw,22px)}.choice .tick{color:#557087;font-weight:800;font-size:15px}.choice.selected .tick{color:#0d639a}.feedback{margin-top:17px;padding:17px 20px;border-radius:18px;font-weight:800}.feedback.good{background:#e0f7e8;color:#12623f}.feedback.retry{background:#fff1d8;color:#8d5619}.feedback .detail{font-size:16px;font-weight:500;margin-top:5px}.scene{background:linear-gradient(#cceefd 0 55%,#d5ead2 55%);border:3px solid #d4e3eb;border-radius:24px;min-height:315px;position:relative;overflow:hidden;margin:15px 0}.scene:after{content:'';position:absolute;bottom:0;height:25%;width:100%;background:repeating-linear-gradient(90deg,#d9dee2 0 68px,#c1c9d1 69px 71px);opacity:.9}.scene .s-title{position:absolute;top:12px;left:15px;padding:5px 12px;border-radius:9px;background:#ffffffdd;font-weight:900;z-index:2}.hotspot{position:absolute;z-index:3;border:3px solid #718da0;background:#fffffff0;border-radius:20px;min-width:100px;padding:13px 14px;display:flex;flex-direction:column;align-items:center;gap:4px;color:#163955;font-weight:900;box-shadow:0 5px 10px #26516e22}.hotspot span{font-size:47px;line-height:1.15}.hotspot.found{background:#ffecb4;border-color:#f5a623}.hotspot.safe{background:#e9f8e9;border-color:#73c89e}.hotspot[data-i="0"]{top:22%;left:6%}.hotspot[data-i="1"]{top:22%;right:6%}.hotspot[data-i="2"]{bottom:13%;left:7%}.hotspot[data-i="3"]{bottom:13%;right:7%}.hotspot small{font-size:14px}.notice{padding:12px 16px;background:#fff8e7;border-left:5px solid #efad36;border-radius:12px;font-size:16px}.stepbar{display:flex;gap:6px;margin-top:15px}.stepbar div{height:8px;flex:1;border-radius:12px;background:#e1eaf3}.stepbar .filled{background:#5ca8d5}.field{display:flex;flex-direction:column;gap:6px;margin-bottom:16px}.field label{font-weight:900;font-size:16px}.field input,.field select,.field textarea{border:2px solid #cfdde9;border-radius:12px;padding:12px;background:white;width:100%;color:var(--ink)}.field textarea{min-height:85px}.columns{display:grid;grid-template-columns:1fr 1fr;gap:20px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:16px 0}.stat{background:#eff6fb;border-radius:15px;padding:14px;text-align:center}.stat b{font-size:28px;display:block}.stat small{color:var(--muted)}.record{border:1px solid #dae7f1;border-radius:15px;padding:15px;margin-top:10px;background:#fff}.record .row{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}.empty{text-align:center;padding:32px;color:var(--muted)}.teacher-head{background:#eaf3fc;border-radius:16px;padding:15px;margin:10px 0 18px}.footer{font-size:13px;text-align:center;color:var(--muted);padding-top:25px}.hidden{display:none!important}.statusline{font-size:14px;color:var(--muted)}.mini{font-size:15px}.flag{display:inline-block;background:#fff2d5;padding:5px 10px;border-radius:11px;font-size:14px;font-weight:900}@media(max-width:680px){.hero{grid-template-columns:1fr}.heroart{min-height:175px}.levels{grid-template-columns:1fr 1fr}.panel{border-radius:18px;padding:18px}.choice{min-height:165px;padding:8px}.choice .pic{height:95px}.scene{min-height:365px}.hotspot{min-width:105px;padding:8px}.hotspot span{font-size:39px}.columns{grid-template-columns:1fr}.stats{grid-template-columns:repeat(3,1fr)}}@media(max-width:400px){.levels{grid-template-columns:1fr}.choice strong{font-size:16px}.hotspot{min-width:88px;padding:7px}.hotspot span{font-size:35px}.hotspot small{font-size:12px}}

{type:'single',ask:'走路時，哪一個比較安全？',opts:[['🚶🌿','在步道慢慢走'],['🧗','跨越欄杆玩']],ok:[0],why:'走步道、慢慢走，不跨越欄杆。'},
{type:'single',ask:'活動開始前，我要先做什麼？',opts:[['👀','先觀察環境'],['🏃💨','不看地面直接跑']],ok:[0],why:'先看地面和周圍有沒有危險。'},
{type:'single',ask:'看到有人在樓梯推擠，我會怎麼做？',opts:[['🛑','不跟著推擠'],['🤼','也一起推擠']],ok:[0],why:'樓梯上推擠容易跌倒，要保持安全距離。'}]},
{title:'我會注意活動環境',week:12,icon:'🔎',sub:'找出環境中的危險',questions:[
{type:'hotspot',ask:'找一找：校園裡哪些地方有危險？',desc:'請點選所有危險的地方。',opts:[['💧','地上有水'],['🎒','走道有書包'],['🌳','安全的步道'],['🧱','樓梯破損']],ok:[0,1,3],why:'地上有水、走道有障礙物、樓梯破損，都需要注意並避開。'},
{type:'single',ask:'地上有水時，怎麼走比較安全？',opts:[['👣↪️','先繞開濕滑處'],['🏃💦','直接跑過去']],ok:[0],why:'看到濕滑地面，先停下來並繞開。'},
{type:'single',ask:'走道中間有書包，該怎麼辦？',opts:[['🚶↪️','繞開並提醒老師'],['🏃🎒','直接跨過去奔跑']],ok:[0],why:'避開障礙物，必要時告訴老師。'},
{type:'single',ask:'活動前，哪種做法正確？',opts:[['👀🏫','先看周圍環境'],['🙈','不看直接玩']],ok:[0],why:'先觀察環境，才能選擇安全的位置。'}]},
{title:'戶外活動怎麼選？',week:13,icon:'🚲',sub:'比較兩種活動方式',questions:[
{type:'single',ask:'騎腳踏車時，哪一個比較安全？',opts:[['🚴🪖','戴安全帽騎車'],['🚴','不戴安全帽騎車']],ok:[0],why:'騎腳踏車應戴合適的安全帽，保護頭部。'},
{type:'single',ask:'想玩球，哪裡比較安全？',opts:[['⚽🌳','在空地或球場玩'],['⚽🚗','在車道玩球']],ok:[0],why:'玩球要選擇適合的空地或球場，遠離車道。'},
{type:'single',ask:'開始運動前應該怎麼做？',opts:[['🙆','先暖身再運動'],['🏃💨','直接用力猛跑']],ok:[0],why:'先做適當暖身，再開始運動。'},
{type:'single',ask:'靠近河邊時，哪一個比較安全？',opts:[['🚶','走安全步道'],['🏃🌊','在岸邊追跑']],ok:[0],why:'水邊不要追逐、推擠，應走安全路線。'}]},
{title:'校園活動安全守則',week:14,icon:'🏫',sub:'學會遵守校園規則',questions:[
{type:'multi',ask:'下列哪些是安全的校園行為？',desc:'可以選不只一張圖片。',opts:[['🪜🤝','走樓梯扶扶手'],['🚶','走廊慢慢走'],['🤼','下課推來推去'],['🏃🏫','在教室奔跑']],ok:[0,1],why:'樓梯扶好扶手、走廊慢慢走，不在教室奔跑或互相推擠。'},
{type:'single',ask:'上下樓梯，哪一個比較安全？',opts:[['🪜','慢慢走、扶扶手'],['🦘','一次跳很多階']],ok:[0],why:'上下樓梯要慢慢走，並使用扶手。'},
{type:'single',ask:'下課要喝水，應該怎麼做？',opts:[['🚶🚰','排隊等候'],['🏃🚰','衝去插隊']],ok:[0],why:'依序排隊，注意自己與同學的安全。'},
{type:'single',ask:'老師說明活動規則時，我要？',opts:[['👂','先聽再做'],['🎮','不聽就開始']],ok:[0],why:'先聽清楚活動規則再開始。'}]},
{title:'遇到危險怎麼辦？',week:15,icon:'🆘',sub:'停止、避開、尋求協助',questions:[
{type:'single',ask:'球滾到車道上，我要怎麼辦？',opts:[['🛑🙋','先停下來，找大人幫忙'],['🏃🚗','直接衝去撿球']],ok:[0],why:'不能直接衝進車道，先停下並找大人協助。'},
{type:'single',ask:'朋友跌倒受傷，我要怎麼做？',opts:[['🧑‍🏫','告訴老師，請求協助'],['🙈','當作沒看到']],ok:[0],why:'看見別人受傷，應立即告訴老師或可信任的大人。'},
{type:'single',ask:'遊樂設施壞了，哪一個比較安全？',opts:[['🚫','停止使用並告訴老師'],['🛝','繼續玩']],ok:[0],why:'損壞的設施不要使用，應找大人處理。'},
{type:'single',ask:'需要協助時，可以說哪句話？',opts:[['🙋','老師，我需要幫忙。'],['🤐','不說話，也不求助']],ok:[0],why:'用簡短的話表達需求，例如「老師，我需要幫忙」。'}]},
{title:'我的安全休閒挑戰',week:16,icon:'🏅',sub:'六週綜合練習',questions:[
{type:'multi',ask:'最後挑戰：哪些做法是安全的？',desc:'選出所有安全的做法。',opts:[['🚶','在步道慢慢走'],['💦🏃','在濕地奔跑'],['🛑','看到危險先停下來'],['🤼','在樓梯上推人']],ok:[0,2],why:'安全的行動是慢慢走、先停下來確認危險。'},
{type:'single',ask:'看到濕滑地面，我會？',opts:[['👀↪️','先觀察再繞開'],['🏃💦','直接跑過去']],ok:[0],why:'要避開濕滑地面。'},
{type:'single',ask:'朋友在活動時受傷，我會？',opts:[['🙋‍♀️🧑‍🏫','找老師幫忙'],['🤫','自己亂處理']],ok:[0],why:'要立即尋求大人協助，避免自行做不安全的處理。'},
{type:'single',ask:'施工區旁，我會？',opts:[['🚧↩️','不要靠近'],['🏗️','走進去玩']],ok:[0],why:'施工區存在危險，不可以擅自靠近或進入。'}]}
];
let state={page:'home',level:0,q:0,selected:[],checked:false,attempt:0,audio:true,session:null};
const view=document.getElementById('view');const STORE='safetyChallengeRecordsV1';let records=[];try{records=JSON.parse(localStorage.getItem(STORE)||'[]')}catch(e){records=[]}
function save(){try{localStorage.setItem(STORE,JSON.stringify(records))}catch(e){alert('瀏覽器無法儲存紀錄。請改用匯出CSV保留資料。')}}
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function speak(text){if(!state.audio||!('speechSynthesis' in window))return;window.speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(text);u.lang='zh-TW';u.rate=.85;window.speechSynthesis.speak(u)}
function toggleAudio(){state.audio=!state.audio;document.getElementById('tab-audio').innerText=state.audio?'🔊 語音：開':'🔇 語音：關';if(!state.audio&&'speechSynthesis'in window)window.speechSynthesis.cancel()}
function go(page){state.page=page;render();scrollTo({top:0,behavior:'smooth'})}
function render(){for(const n of ['home','levels','teacher'])document.getElementById('tab-'+n).classList.toggle('active',state.page===n);if(state.page==='home')home();else if(state.page==='levels')levels();else if(state.page==='quiz')quiz();else if(state.page==='finish')finish();else teacher()}
function home(){view.innerHTML=`<section class="panel hero"><div><div class="eyebrow">115學年度｜第一學期｜第11–16週</div><h1>安全休閒<br>大挑戰</h1><p>我會觀察環境、選擇安全的玩法，遇到危險時找人幫忙。</p><p class="muted mini">六個關卡，每個關卡四題。點選圖片就能答題，答錯也能再試一次。</p><div class="actions"><button class="btn" onclick="go('levels')">▶ 開始六週闖關</button><button class="btn secondary" onclick="go('teacher')">📋 教師紀錄</button></div></div><div class="heroart" aria-hidden="true"><span>🚶‍♀️ 🛡️ 🚴</span></div></section><section class="panel" style="margin-top:18px"><h2>我會學到什麼？</h2><div class="levels">${units.map((u,i)=>`<button class="level" onclick="start(${i})"><span class="num">第${u.week}週｜第${i+1}關</span><span class="emoji">${u.icon}</span><strong>${u.title}</strong><span class="sub">${u.sub}</span></button>`).join('')}</div></section>`}
function levels(){view.innerHTML=`<section class="panel"><div class="sectionhead"><div><div class="eyebrow">六週課程</div><h1>選擇學習關卡</h1></div><span class="chip">每關4題・可重複挑戰</span></div><p class="muted">教師可以依教學週次選關，不需按順序過關。完成後可記錄學生的提示程度。</p><div class="levels">${units.map((u,i)=>`<button class="level" onclick="start(${i})"><span class="num">第${u.week}週｜第${i+1}關</span><span class="emoji">${u.icon}</span><strong>${u.title}</strong><span class="sub">${u.sub}</span></button>`).join('')}</div></section>`}
function start(i){state.level=i;state.q=0;state.selected=[];state.checked=false;state.attempt=0;state.session={correctFirst:0,attempts:0,completed:0,started:new Date().toISOString()};state.page='quiz';render();speak(units[i].title+'。'+units[i].questions[0].ask)}
function select(i){if(state.checked)return;let q=units[state.level].questions[state.q];if(q.type==='single')state.selected=[i];else state.selected=state.selected.includes(i)?state.selected.filter(n=>n!==i):[...state.selected,i];quiz(false)}
function check(){const q=units[state.level].questions[state.q];if(!state.selected.length)return;state.attempt++;state.session.attempts++;const pass=state.selected.length===q.ok.length&&state.selected.every(n=>q.ok.includes(n));state.checked=pass;if(pass){if(state.attempt===1)state.session.correctFirst++;state.session.completed++;speak('答對了。'+q.why)}else{speak('再試一次。'+(q.type==='single'?'想想哪個比較安全。':'請再找找看。'))}quiz(false,!pass)}
function speakQuestion(){speak(units[state.level].questions[state.q].ask)}
function next(){if(!state.checked)return;if(state.q===3){state.page='finish';render();speak('恭喜完成本週安全挑戰')}else{state.q++;state.selected=[];state.checked=false;state.attempt=0;render();speak(units[state.level].questions[state.q].ask)}}
function quiz(initial=true,incorrect=false){const u=units[state.level],q=u.questions[state.q];const isMulti=q.type!=='single';view.innerHTML=`<section class="panel"><div class="quiz-top"><span class="chip">${u.icon} 第${u.week}週・${esc(u.title)}</span><button class="smallbtn" onclick="go('levels')">離開關卡</button></div><div class="progress"><div style="width:${(state.q+(state.checked?1:0))*25}%"></div></div><div class="statusline" style="margin-top:8px">第 ${state.q+1} 題 / 共 4 題</div><h2 class="prompt">${esc(q.ask)} <button class="smallbtn" onclick="speakQuestion()" aria-label="朗讀題目">🔊 聽題目</button></h2><div class="hint">${esc(q.desc|| (isMulti?'點選所有符合的圖片，再按「確認答案」。':'點選一張圖片，再按「確認答案」。'))}</div>${q.type==='hotspot'?`<div class="scene"><span class="s-title">🏫 校園安全觀察</span>${q.opts.map((o,i)=>`<button class="hotspot ${state.selected.includes(i)?(q.ok.includes(i)?'found':'safe'):''}" data-i="${i}" onclick="select(${i})"><span>${o[0]}</span><small>${esc(o[1])}</small></button>`).join('')}</div>`:`<div class="choices ${q.opts.length>2?'four':''}">${q.opts.map((o,i)=>`<button class="choice ${state.selected.includes(i)?'selected':''} ${state.checked&&state.selected.includes(i)?'right':''}" onclick="select(${i})" aria-pressed="${state.selected.includes(i)}"><div class="pic"><span>${o[0]}</span></div><strong>${esc(o[1])}</strong><span class="tick">${state.selected.includes(i)?'☑ 已選擇':'□ 點這張圖片'}</span></button>`).join('')}</div>`}<div class="stepbar">${Array.from({length:4},(_,i)=>`<div class="${i<state.q+(state.checked?1:0)?'filled':''}"></div>`).join('')}</div>${state.checked?`<div class="feedback good">✅ 答對了！做得很好！<div class="detail">${esc(q.why)}</div></div>`:incorrect?`<div class="feedback retry">💡 再想一想！<div class="detail">你可以重新選擇圖片，再按「確認答案」。</div></div>`:''}<div class="actions">${state.checked?`<button class="btn green" onclick="next()">${state.q===3?'🏅 完成關卡':'下一題 →'}</button>`:`<button class="btn" onclick="check()" ${state.selected.length?'':'disabled'}>確認答案</button><button class="btn secondary" onclick="state.selected=[];quiz(false)">重新選擇</button>`}<button class="btn secondary" onclick="speakQuestion()">🔊 再聽一次</button></div><p class="muted mini" style="margin-top:16px">${q.type==='hotspot'?'操作提醒：請點選畫面中的物件。':''} 本題可反覆練習，不會扣分。</p></section>`;}
function finish(){const u=units[state.level],s=state.session;view.innerHTML=`<section class="panel" style="text-align:center"><div style="font-size:85px">🏅</div><div class="eyebrow">第${u.week}週完成</div><h1>安全小達人！</h1><p>你完成了「${esc(u.title)}」四個安全任務。</p><div class="stats"><div class="stat"><b>4 / 4</b><small>完成題數</small></div><div class="stat"><b>${s.correctFirst} / 4</b><small>首次答對</small></div><div class="stat"><b>${s.attempts}</b><small>總作答次數</small></div></div><p class="notice" style="text-align:left">📌 小提醒：答題表現不等於能在真實情境獨立完成。教師可在實地活動後記錄提示程度與觀察結果。</p><div class="actions" style="justify-content:center"><button class="btn green" onclick="recordForm()">📋 儲存教師觀察紀錄</button><button class="btn secondary" onclick="start(${state.level})">🔄 再挑戰一次</button><button class="btn secondary" onclick="go('levels')">返回六週關卡</button></div></section>`}
function recordForm(){const u=units[state.level],s=state.session;view.innerHTML=`<section class="panel"><div class="eyebrow">教師觀察紀錄</div><h1>記錄本次學習</h1><div class="teacher-head">第${u.week}週｜${esc(u.title)}<br><span class="mini">首次答對 ${s.correctFirst}/4 題・總作答 ${s.attempts} 次</span></div><form id="recordform"><div class="columns"><div class="field"><label for="student">學生代號或姓名</label><input id="student" maxlength="60" placeholder="例：學生A" required></div><div class="field"><label for="date">觀察日期</label><input type="date" id="date" required></div></div><div class="columns"><div class="field"><label for="skill">評量項目</label><select id="skill"><option>安全情境辨識</option><option>安全方式選擇</option><option>危險時求助</option><option>綜合應用</option></select></div><div class="field"><label for="promptLevel">完成時的提示程度</label><select id="promptLevel"><option>獨立完成</option><option>口語提示後完成</option><option>圖片提示後完成</option><option>動作示範後完成</option><option>身體協助後完成</option><option>尚未完成</option></select></div></div><div class="field"><label for="transfer">生活情境實作表現</label><select id="transfer"><option>尚未進行實作</option><option>能獨立完成</option><option>在提示下完成</option><option>尚未完成</option></select></div><div class="field"><label for="note">教師觀察補充</label><textarea id="note" placeholder="例：能指出地面濕滑，但實地行走仍需口語提醒。"></textarea></div><div class="actions"><button class="btn green" type="submit">💾 儲存紀錄</button><button class="btn secondary" type="button" onclick="go('levels')">返回關卡</button></div></form></section>`;document.getElementById('date').value=new Date().toLocaleDateString('en-CA');document.getElementById('recordform').addEventListener('submit',ev=>{ev.preventDefault();const r={id:Date.now(),date:document.getElementById('date').value,student:document.getElementById('student').value.trim(),week:u.week,unit:u.title,first:s.correctFirst,total:4,attempts:s.attempts,skill:document.getElementById('skill').value,prompt:document.getElementById('promptLevel').value,transfer:document.getElementById('transfer').value,note:document.getElementById('note').value.trim()};if(!r.student)return;records.push(r);save();go('teacher')})}
function teacher(){view.innerHTML=`<section class="panel"><div class="sectionhead"><div><div class="eyebrow">教師專區</div><h1>學習與評量紀錄</h1></div><span class="chip">目前瀏覽器已儲存 ${records.length} 筆</span></div><p class="muted">教師可以在完成關卡後儲存提示程度、實際應用情形與觀察文字。紀錄僅保留在本機瀏覽器，不會傳送到網路。</p><div class="actions"><button class="btn" onclick="exportCSV()" ${records.length?'':'disabled'}>⬇ 匯出CSV紀錄</button><button class="btn secondary" onclick="window.print()">🖨️ 列印</button>${records.length?'<button class="btn secondary" onclick="clearRecords()">刪除全部本機紀錄</button>':''}</div><div class="field" style="margin-top:25px"><label for="filter">篩選學生</label><input id="filter" placeholder="輸入學生代號或姓名" oninput="renderRecords(this.value)"></div><div id="records"></div><div class="notice" style="margin-top:20px">⚠️ 如使用公用電腦，建議以學生代號記錄，匯出後將本機資料刪除。使用無痕視窗或清除瀏覽資料可能使紀錄消失。</div></section>`;renderRecords('')}
function renderRecords(filter){let arr=records.filter(r=>r.student.includes(filter)).slice().reverse();document.getElementById('records').innerHTML=arr.length?arr.map(r=>`<article class="record"><div class="row"><strong>${esc(r.student)}｜第${r.week}週 ${esc(r.unit)}</strong><span class="statusline">${esc(r.date)}</span></div><div class="mini">首次答對：${r.first}/${r.total}｜作答次數：${r.attempts}｜${esc(r.skill)}</div><div class="mini"><b>提示程度：</b>${esc(r.prompt)}　<b>實作：</b>${esc(r.transfer)}</div>${r.note?`<p class="mini">觀察：${esc(r.note)}</p>`:''}<button class="smallbtn" onclick="deleteRecord(${r.id})">刪除此筆</button></article>`).join(''):'<div class="empty">📭 尚無符合條件的紀錄。完成任一關卡後可以新增觀察紀錄。</div>'}
function deleteRecord(id){if(!confirm('確定刪除這筆紀錄？'))return;records=records.filter(r=>r.id!==id);save();teacher()}
function clearRecords(){if(!confirm('確定刪除全部本機學習紀錄？此動作無法復原。'))return;records=[];save();teacher()}
function exportCSV(){const cols=[['日期','date'],['學生','student'],['週次','week'],['單元','unit'],['首次答對題數','first'],['總題數','total'],['作答次數','attempts'],['評量項目','skill'],['提示程度','prompt'],['實作表現','transfer'],['教師觀察','note']];const quote=s=>'"'+String(s??'').replace(/"/g,'""')+'"';const csv='\ufeff'+cols.map(c=>quote(c[0])).join(',')+'\r\n'+records.map(r=>cols.map(c=>quote(r[c[1]])).join(',')).join('\r\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='安全休閒大挑戰_教師評量紀錄.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1500)}
render();
</script></body></html>
