<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>科技第三單元｜五週互動教學</title><style>
:root{font-family:"Microsoft JhengHei","Noto Sans TC",system-ui,sans-serif;color:#122b58;background:#edf5ff}*{box-sizing:border-box}body{margin:0}header{background:linear-gradient(110deg,#d6ebff,#fff);padding:16px 24px;border-bottom:4px solid #64b6ed}header .top{display:flex;align-items:center;gap:15px;flex-wrap:wrap}h1{font-size:clamp(25px,4vw,40px);margin:6px 0}h2{font-size:clamp(22px,3vw,30px)}.tag{background:#1767b3;color:white;border-radius:24px;padding:9px 18px;font-weight:800}.sub{font-weight:700}main{max-width:1050px;margin:auto;padding:22px}.panel{background:white;border:2px solid #bfdaf4;border-radius:22px;padding:22px;margin:15px 0;box-shadow:0 4px 15px #17487712}.week-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px}.week-card{border:3px solid #c3def6;border-radius:20px;background:white;color:#14376d;min-height:166px;text-align:center;font:inherit;font-weight:800;padding:18px;cursor:pointer}.week-card:hover,.choice:hover{border-color:#1678be;background:#f1faff}.week-card .emoji{font-size:54px;display:block;margin-bottom:8px}.week-card .small{display:block;color:#3778ac;font-size:17px}.btn{border:none;border-radius:14px;background:#1668b4;color:white;font:inherit;font-size:21px;font-weight:800;padding:13px 23px;cursor:pointer;min-height:52px}.btn.secondary{background:#e4f2ff;color:#13426f}.btn:disabled{background:#b1bfcc;cursor:not-allowed}.toolbar{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center}.hint{font-size:18px;color:#436388}.question-title{font-size:clamp(23px,3vw,31px);font-weight:900;line-height:1.5}.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(195px,1fr));gap:15px;margin:20px 0}.choice{border:3px solid #c2def4;border-radius:18px;background:#fafcff;min-height:158px;padding:14px;cursor:pointer;color:#122f5c;font:inherit;font-size:21px;font-weight:800}.choice .picture{display:block;font-size:65px;line-height:1.4}.choice.correct{border-color:#35a575;background:#e9f9ed}.choice.wrong{border-color:#e2a44c;background:#fff3e2}.choice:disabled{cursor:default}.feedback{min-height:70px;border-radius:15px;background:#ecf7ff;padding:16px;font-size:22px;font-weight:800;margin:10px 0}.feedback.good{background:#e2f6e7;color:#17643b}.feedback.try{background:#fff2d8;color:#784813}.progress{height:16px;background:#dce9fa;border-radius:18px;overflow:hidden}.progress>div{height:100%;background:#39a9ad;transition:width .2s}.hidden{display:none!important}label{font-size:20px;font-weight:700;display:block;margin:10px 0}select,input{font:inherit;font-size:20px;padding:8px;border-radius:8px;border:2px solid #abcce6;max-width:100%}.foot{text-align:center;color:#58728a;padding:25px}.pair-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.pair{width:100%;font:inherit;font-size:20px;font-weight:800;padding:14px;min-height:85px;background:#fff;border:3px solid #b9d7ee;border-radius:14px;margin:6px 0;cursor:pointer}.pair.active{background:#fff2be;border-color:#e0ae22}.pair.done{background:#e1f9e8;border-color:#39a675}.nav-row{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}@media(max-width:600px){main{padding:12px}.panel{padding:14px}.choices{grid-template-columns:1fr 1fr}.choice{font-size:17px;min-height:140px}.choice .picture{font-size:52px}.pair{font-size:16px}}
</style></head><body><header><div class="top"><span class="tag">⚙️ 科技</span><span class="sub">第三單元：能源與生活周遭的關聯</span></div><h1>智慧家電與節能生活</h1><div>第11–15週｜國中集中式特教班互動教材</div></header><main><section id="home"><div class="panel"><h2>🏠 選擇今天的學習任務</h2><p class="hint">每次一題。點圖片、聽題目，完成後再按「下一題」。</p><div id="weekGrid" class="week-grid"></div></div></section><section id="lesson" class="hidden"><div class="panel"><div class="toolbar"><button id="back" class="btn secondary">⌂ 回首頁</button><span id="counter" class="hint"></span><button id="speak" class="btn secondary">🔊 唸題目</button></div><h2 id="lessonTitle"></h2><div class="progress"><div id="bar"></div></div><div id="questionArea"></div><div id="feedback" class="feedback hidden" role="status" aria-live="polite"></div><div class="nav-row"><button id="retry" class="btn secondary">↻ 再試一次</button><button id="next" class="btn" disabled>下一題 →</button></div></div></section><section class="panel"><details><summary style="font-size:23px;font-weight:800;cursor:pointer">👩‍🏫 教師評量與學習紀錄</summary><p class="hint">請選擇學生代號；同一裝置上的紀錄依代號分開儲存，不會傳送至伺服器。</p><label>學生代號 <input id="student" value="學生1" maxlength="24"></label><div id="record"></div><div id="rubrics"></div><button class="btn secondary" id="copy">複製評量紀錄</button><p id="copied" role="status"></p></details></section></main><footer class="foot">科技領域｜生活化圖片提示・語音朗讀・即時回饋</footer><script>
'use strict';
const lessons=[
{title:'認識智慧家電',icon:'🏠',questions:[
{type:'choice',title:'哪一個是會自己清潔地板的智慧家電？',options:[['🤖','掃地機器人'],['🌀','一般電風扇']],answer:0,good:'掃地機器人可以自動清潔地板。',hint:'找一找，哪一個會在地板上移動？'},
{type:'choice',title:'想用指紋開門，可以使用哪一個？',options:[['🔐','智慧門鎖'],['🍚','電鍋']],answer:0,good:'智慧門鎖可以用指紋開門。',hint:'找有鎖和指紋功能的設備。'},
{type:'pairs',title:'把智慧家電和功能配在一起。',pairs:[[['🤖','掃地機器人'],['🧹','清潔地板']],[['💡','智慧燈泡'],['📱','用手機控制燈光']],[['🔐','智慧門鎖'],['🚪','開門與上鎖']]],good:'三個家電都配對成功！'}]},
{title:'智慧科技讓生活更方便',icon:'🤖',questions:[
{type:'choice',title:'地板有灰塵，你會選哪一個幫忙？',options:[['🤖','掃地機器人'],['🔐','智慧門鎖']],answer:0,good:'對！掃地機器人可以幫忙清潔地板。',hint:'想想哪個家電會掃地。'},
{type:'choice',title:'想用手機調整燈光，選哪一個？',options:[['💡','智慧燈泡'],['🌀','一般電風扇']],answer:0,good:'智慧燈泡可以搭配手機控制。',hint:'找有燈泡的選項。'},
{type:'choice',title:'出門忘了帶鑰匙，哪一種設備能使用設定好的指紋開門？',options:[['🍚','電鍋'],['🔐','指紋智慧門鎖']],answer:1,good:'對！已設定指紋的智慧門鎖可以開門。',hint:'找有門鎖的選項。'}]},
{title:'我會愛護家中的電器',icon:'🧽',questions:[
{type:'choice',title:'電風扇外面有灰塵，哪個做法較安全？',options:[['🧽','確認斷電後清潔外部'],['💦','通電時直接潑水']],answer:0,good:'正確！確認斷電後，再依安全方法清潔。',hint:'先想想用電安全。'},
{type:'choice',title:'冷氣濾網很髒，怎麼做比較好？',options:[['✅','請大人依說明書安全清潔'],['❌','完全不理會']],answer:0,good:'定期安全清潔濾網有助保養冷氣。',hint:'濾網需要適當保養。'},
{type:'choice',title:'手濕濕的時候，可以碰插座嗎？',options:[['🙅','不可以'],['👌','可以']],answer:0,good:'答對！手濕時不碰插座。',hint:'濕手碰插座有觸電風險。'}]},
{title:'節約用電我最行',icon:'💡',questions:[
{type:'choice',title:'離開沒有人的教室時，電燈要怎麼做？',options:[['🌙','關掉不需要的燈'],['☀️','全部繼續開著']],answer:0,good:'隨手關掉不需要的燈可以節電。',hint:'教室沒有人時不需要一直亮著。'},
{type:'choice',title:'電風扇不使用時，要怎麼做？',options:[['🔘','關閉電源'],['🌀','繼續吹']],answer:0,good:'不用電風扇時關掉電源。',hint:'停止使用時可以讓它休息。'},
{type:'choice',title:'白天教室光線很充足，哪個做法較節能？',options:[['🪟','安全且適合時利用自然光'],['💡','所有電燈都開著']],answer:0,good:'充分利用自然光可以減少不必要的照明。',hint:'想想窗外的太陽光。'}]},
{title:'我是節能生活小達人',icon:'🏆',questions:[
{type:'choice',title:'哪個是正確的電器保養行為？',options:[['🧽','安全斷電後清潔'],['💦','對插座潑水']],answer:0,good:'知道正確保養方式了！',hint:'安全第一，先確認斷電。'},
{type:'choice',title:'看完電視後，哪個行為較節能？',options:[['📺','關閉不使用的電視'],['🔆','讓電視一直播放']],answer:0,good:'答對！不使用時關閉電視。',hint:'不使用的電器不必一直開著。'},
{type:'choice',title:'下課離開教室前，你可以完成什麼節能任務？',options:[['💡','在教師提醒下關閉不需要的燈'],['🌀','讓所有電風扇一直開']],answer:0,good:'很好！請在教師陪同下完成真正的節能任務。',hint:'想想離開教室前可以關閉什麼。'},
{type:'task',title:'生活任務：你實際完成關燈或關閉不使用的電風扇了嗎？',options:[['✅','我完成了'],['🧑‍🏫','我要老師幫忙']],good:'完成生活任務！',hint:'請和老師一起在真實教室練習。'}]}];
const $=id=>document.getElementById(id);let week=0,step=0,solved=false,wrong=0,selected=-1,matches=new Set(),left=null;const key=()=> 'tech115_'+$('student').value.trim();function getData(){try{return JSON.parse(localStorage.getItem(key())||'{}')}catch{return {}}}function setData(d){try{localStorage.setItem(key(),JSON.stringify(d))}catch{}}function say(t){if(!('speechSynthesis' in window))return;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='zh-TW';u.rate=.85;speechSynthesis.speak(u)}catch{}}function home(){$('home').classList.remove('hidden');$('lesson').classList.add('hidden');drawHome();drawRecord()}function drawHome(){const d=getData();$('weekGrid').innerHTML=lessons.map((l,i)=>`<button class="week-card" data-week="${i}"><span class="emoji">${l.icon}</span><span class="small">第${i+11}週 ${d['w'+i]?'✅ 已完成':''}</span>${l.title}</button>`).join('');document.querySelectorAll('[data-week]').forEach(b=>b.addEventListener('click',()=>openWeek(Number(b.dataset.week))))}function openWeek(i){week=i;step=0;$('home').classList.add('hidden');$('lesson').classList.remove('hidden');render()}function current(){return lessons[week].questions[step]}function render(){solved=false;wrong=0;selected=-1;matches=new Set();left=null;const q=current();$('lessonTitle').textContent=`第${week+11}週｜${lessons[week].title}`;$('counter').textContent=`第 ${step+1} / ${lessons[week].questions.length} 題`;$('bar').style.width=(step/lessons[week].questions.length*100)+'%';$('next').disabled=true;$('next').textContent='下一題 →';$('feedback').className='feedback hidden';let h=`<p class="question-title">${q.title}</p>`;if(q.type==='pairs'){h+='<p class="hint">先點左邊的家電，再點右邊的功能。</p><div class="pair-grid"><div>';q.pairs.forEach((p,i)=>h+=`<button class="pair" data-left="${i}">${p[0][0]}　${p[0][1]}</button>`);h+='</div><div>';const order=[2,0,1];order.forEach(i=>h+=`<button class="pair" data-right="${i}">${q.pairs[i][1][0]}　${q.pairs[i][1][1]}</button>`);h+='</div></div>'}else{h+='<div class="choices">';q.options.forEach((o,i)=>h+=`<button class="choice" data-choice="${i}"><span class="picture">${o[0]}</span>${o[1]}</button>`);h+='</div>'}$('questionArea').innerHTML=h;document.querySelectorAll('[data-choice]').forEach(b=>b.addEventListener('click',()=>answer(Number(b.dataset.choice))));document.querySelectorAll('[data-left]').forEach(b=>b.addEventListener('click',()=>{if(solved)return;left=Number(b.dataset.left);document.querySelectorAll('[data-left]').forEach(x=>x.classList.toggle('active',Number(x.dataset.left)===left))}));document.querySelectorAll('[data-right]').forEach(b=>b.addEventListener('click',()=>pairAnswer(Number(b.dataset.right))))}function feedback(t,good){$('feedback').className='feedback '+(good?'good':'try');$('feedback').textContent=(good?'✅ ':'💡 ')+t}function answer(i){if(solved)return;const q=current();const b=document.querySelector(`[data-choice="${i}"]`);if(q.type==='task'){if(i===1){feedback('請老師協助你完成真實任務。',false);return}solved=true;feedback(q.good,true);b.classList.add('correct');$('next').disabled=false;return}if(i===q.answer){solved=true;b.classList.add('correct');feedback(q.good,true);$('next').disabled=false;say(q.good)}else{wrong++;b.classList.add('wrong');feedback(q.hint,false)}}function pairAnswer(i){if(solved||left===null||matches.has(i))return;const q=current();if(left===i){matches.add(i);document.querySelector(`[data-left="${i}"]`).classList.add('done');document.querySelector(`[data-right="${i}"]`).classList.add('done');left=null;document.querySelectorAll('[data-left]').forEach(x=>x.classList.remove('active'));if(matches.size===q.pairs.length){solved=true;feedback(q.good,true);$('next').disabled=false}else feedback(`配對成功，已完成 ${matches.size} 組。`,true)}else{wrong++;feedback('再看看家電的用途，重新選擇。',false)}}function next(){if(!solved)return;if(step+1<lessons[week].questions.length){step++;render();return}const d=getData();d['w'+week]=true;setData(d);$('bar').style.width='100%';$('counter').textContent='本週完成';$('questionArea').innerHTML=`<div style="text-align:center;padding:35px"><div style="font-size:85px">🏆</div><h2>完成第${week+11}週任務！</h2><p>你已完成這一週的互動練習。</p><button id="finish" class="btn">返回首頁</button></div>`;$('finish').addEventListener('click',home);$('feedback').className='feedback hidden';$('next').disabled=true;drawRecord()}const objectives=['辨識1至2種智慧家電並指出功能','說出1項常見電器保養方式','說出1種節約能源方法','在提醒下實際執行節能行為'];function drawRecord(){const d=getData();$('record').innerHTML=lessons.map((l,i)=>`<p>第${i+11}週　${l.title}：<strong>${d['w'+i]?'已完成':'未完成'}</strong></p>`).join('');$('rubrics').innerHTML=objectives.map((t,i)=>`<label>${i+1}. ${t}<br><select data-r="${i}"><option value="">尚未評量</option><option>獨立完成</option><option>提示完成</option><option>尚需協助</option></select></label>`).join('');document.querySelectorAll('[data-r]').forEach(s=>{s.value=d['r'+s.dataset.r]||'';s.addEventListener('change',()=>{const updated=getData();updated['r'+s.dataset.r]=s.value;setData(updated)})})}function copyRecord(){const d=getData();const s=['科技第三單元學習紀錄','學生代號：'+$('student').value,...lessons.map((l,i)=>`第${i+11}週 ${l.title}：${d['w'+i]?'已完成':'未完成'}`),...objectives.map((v,i)=>`${v}：${d['r'+i]||'尚未評量'}`)].join('\n');if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(s).then(()=>$('copied').textContent='已複製評量紀錄').catch(()=>{$('copied').textContent=s})}else $('copied').textContent=s}
$('back').addEventListener('click',home);$('speak').addEventListener('click',()=>say(current().title));$('retry').addEventListener('click',render);$('next').addEventListener('click',next);$('student').addEventListener('change',()=>{drawHome();drawRecord()});$('copy').addEventListener('click',copyRecord);drawHome();drawRecord();
</script></body></html>
