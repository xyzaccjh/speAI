<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>互動式數位學習網</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: 'PingFang TC', 'Heiti TC', '微軟正黑體', sans-serif;
            background-color: #f3f4f6;
        }
        /* 增加按鈕點擊時的微小動畫，提升互動感 */
        .learning-card {
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .learning-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
        }
    </style>
</head>
<body class="min-h-screen p-4 md:p-8">

    <div class="max-w-5xl mx-auto">
        
        <!-- 網站標題區塊 -->
        <header class="text-center mb-10 mt-4">
            <h1 class="text-3xl md:text-4xl font-bold text-gray-800 mb-2">洪老師的多元互動學習資源網</h1>
            <p class="text-gray-600 text-lg">選擇一個科目，點擊按鈕開始今天的學習任務！</p>
        </header>

        <!-- 健康與生活自理區塊 -->
        <section class="mb-12 bg-white rounded-2xl shadow-sm p-6 md:p-8 border-t-4 border-green-500">
            <div class="flex items-center mb-6">
                <span class="text-3xl mr-3">🌱</span>
                <h2 class="text-2xl font-bold text-gray-800">健康與生活自理</h2>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4 md:gap-6">
                
                <a href="生活好習慣互動組句.html" target="_blank" rel="noopener noreferrer" class="learning-card block bg-green-50 hover:bg-green-100 border border-green-200 rounded-xl p-5 text-center decoration-transparent">
                    <div class="text-green-700 font-bold text-lg mb-1">生活常規</div>
                    <div class="text-green-900 font-medium">生活好習慣互動組句</div>
                </a>

                

                

                

            </div>
        </section>

        <!-- 社會與法治區塊 -->
        <section class="mb-12 bg-white rounded-2xl shadow-sm p-6 md:p-8 border-t-4 border-amber-500">
            <div class="flex items-center mb-6">
                <span class="text-3xl mr-3">🌍</span>
                <h2 class="text-2xl font-bold text-gray-800">社會與規範</h2>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4 md:gap-6">
                
                <a href="認識交通號誌與標誌.html" target="_blank" rel="noopener noreferrer" class="learning-card block bg-amber-50 hover:bg-amber-100 border border-amber-200 rounded-xl p-5 text-center decoration-transparent">
                    <div class="text-amber-700 font-bold text-lg mb-1">社會環境</div>
                    <div class="text-amber-900 font-medium">認識交通號誌與標誌</div>
                </a>

                

            </div>
        </section>

        <!-- 社會技巧區塊 (新增) -->
        <section class="mb-12 bg-white rounded-2xl shadow-sm p-6 md:p-8 border-t-4 border-purple-500">
            <div class="flex items-center mb-6">
                <span class="text-3xl mr-3">🤝</span>
                <h2 class="text-2xl font-bold text-gray-800">社會技巧</h2>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4 md:gap-6">
                
                <a href="誰偷走了我的注意力.html" target="_blank" rel="noopener noreferrer" class="learning-card block bg-purple-50 hover:bg-purple-100 border border-purple-200 rounded-xl p-5 text-center decoration-transparent">
                    <div class="text-purple-700 font-bold text-lg mb-1">自我覺察</div>
                    <div class="text-purple-900 font-medium">誰偷走了我的注意力?</div>
                </a>
                <a href="第6週_我為什麼會分心_互動教材.html" target="_blank" rel="noopener noreferrer" class="learning-card block bg-purple-50 hover:bg-purple-100 border border-purple-200 rounded-xl p-5 text-center decoration-transparent">
                    <div class="text-purple-700 font-bold text-lg mb-1">自我管理｜第6週</div>
                    <div class="text-purple-900 font-medium">我為什麼會分心？</div>
                </a>

            </div>
        </section>

        <footer class="text-center text-gray-500 text-sm mt-8 pb-8">
            <p>點擊上方卡片即可開啟互動學習內容。請確保您的網路連線正常。</p>
        </footer>

    </div>

</html>
