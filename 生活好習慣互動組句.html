<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>生活好習慣：互動組句練習</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary-color: #4f46e5;    /* 溫和的 Indigo */
            --secondary-color: #3b82f6;  /* 舒適的 Blue */
            --accent-color: #f59e0b;     /* 溫暖的 Amber */
            --success-color: #10b981;    /* 活潑的 Emerald */
            --error-color: #ef4444;      /* 醒目的 Red */
        }

        body {
            font-family: 'Nunito', 'Noto Sans TC', sans-serif;
            background-color: #f5f7fb;
            /* 輕微的點狀背景，有助於特教學生視覺聚焦，減少白光造成的眼部壓力 */
            background-image: radial-gradient(#cbd5e1 1.5px, transparent 1.5px);
            background-size: 24px 24px;
            color: #1f2937;
            -webkit-tap-highlight-color: transparent;
        }

        .exercise-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(8px);
            border-radius: 24px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.05), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            border: 2px solid rgba(226, 232, 240, 0.8);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        /* 大尺寸、易點選的單字卡片設計 */
        .word-item {
            display: inline-block;
            font-family: 'Noto Sans TC', sans-serif;
            padding: 0.75rem 1.25rem;
            background: #ffffff;
            border: 3px solid #e2e8f0;
            border-radius: 16px;
            color: #1e293b;
            font-weight: 700;
            cursor: pointer;
            user-select: none;
            transition: all 0.15s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 4px 0 #e2e8f0;
            font-size: 1.25rem;
            margin: 6px;
            touch-action: manipulation; /* 解決行動裝置點擊延遲 */
        }

        .word-item:hover {
            border-color: var(--secondary-color);
            color: var(--secondary-color);
            transform: translateY(-2px);
            box-shadow: 0 6px 0 #dbeafe;
        }

        .word-item:active {
            transform: translateY(4px);
            box-shadow: none;
            background-color: #eff6ff;
        }

        .drop-zone {
            min-height: 90px;
            background-color: #f8fafc;
            border: 3px dashed #cbd5e1;
            border-radius: 18px;
            transition: all 0.3s ease;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            padding: 14px;
            width: 100%;
        }

        /* 國文題目：在作答區中卡片緊密相連，去除間距符合書寫習慣 */
        .drop-zone.chinese-mode {
            gap: 0px !important;
        }

        .drop-zone.chinese-mode .word-item {
            margin: 2px 0px !important;
            border-radius: 0px !important;
            border-left-width: 1.5px !important;
            border-right-width: 1.5px !important;
            box-shadow: none !important;
        }

        /* 圓角修飾，讓頭尾卡片完美包覆 */
        .drop-zone.chinese-mode .word-item:first-child {
            border-top-left-radius: 14px !important;
            border-bottom-left-radius: 14px !important;
            border-left-width: 3px !important;
        }

        .drop-zone.chinese-mode .word-item:last-child {
            border-top-right-radius: 14px !important;
            border-bottom-right-radius: 14px !important;
            border-right-width: 3px !important;
        }

        .drop-zone:empty::before {
            content: attr(data-placeholder);
            color: #94a3b8;
            font-size: 1.1rem;
            font-weight: 500;
            width: 100%;
            text-align: center;
            padding: 10px;
        }

        /* 正確與錯誤狀態 */
        .drop-zone.correct {
            background-color: #ecfdf5;
            border-color: var(--success-color);
            border-style: solid;
        }

        .drop-zone.incorrect {
            background-color: #fef2f2;
            border-color: var(--error-color);
            border-style: solid;
            animation: shake 0.6s cubic-bezier(.36, .07, .19, .97) both;
        }

        @keyframes shake {
            10%, 90% { transform: translate3d(-2px, 0, 0); }
            20%, 80% { transform: translate3d(4px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-6px, 0, 0); }
            40%, 60% { transform: translate3d(6px, 0, 0); }
        }

        /* 喇叭按鈕呼吸與懸停特效 */
        .speaker-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background-color: #e0e7ff;
            color: var(--primary-color);
            cursor: pointer;
            transition: all 0.2s ease;
            border: 2px solid #c7d2fe;
        }

        .speaker-btn:hover {
            background-color: var(--primary-color);
            color: white;
            transform: scale(1.1);
        }

        .speaker-btn:active {
            transform: scale(0.95);
        }

        /* --- 完工慶祝動畫特效 --- */
        .checkmark-wrapper {
            width: 120px;
            height: 120px;
            margin: 0 auto;
        }

        .checkmark {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            display: block;
            stroke-width: 4;
            stroke: #fff;
            stroke-miterlimit: 10;
            box-shadow: inset 0px 0px 0px #10b981;
            animation: fill .4s ease-in-out .4s forwards, scale .3s ease-in-out .9s both;
        }

        .checkmark__check {
            transform-origin: 50% 50%;
            stroke-dasharray: 48;
            stroke-dashoffset: 48;
            animation: stroke 0.3s cubic-bezier(0.65, 0, 0.45, 1) 0.8s forwards;
        }

        @keyframes stroke {
            100% { stroke-dashoffset: 0; }
        }

        @keyframes scale {
            0%, 100% { transform: none; }
            50% { transform: scale3d(1.1, 1.1, 1); }
        }

        @keyframes fill {
            100% { box-shadow: inset 0px 0px 0px 80px #10b981; }
        }

        .confetti {
            position: absolute;
            width: 12px;
            height: 12px;
            background-color: #f00;
            animation: confetti-fall 3.5s linear forwards;
            pointer-events: none;
            z-index: 100;
        }

        @keyframes confetti-fall {
            0% {
                transform: translateY(-10vh) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translateY(110vh) rotate(720deg);
                opacity: 0;
            }
        }
    </style>
</head>
<body class="min-h-screen p-4 pb-16 flex flex-col items-center">

    <div id="completion-overlay"
        class="fixed inset-0 z-50 flex items-center justify-center bg-black/60 backdrop-blur-md hidden opacity-0 transition-opacity duration-500">
        <div class="bg-white p-8 md:p-12 rounded-3xl shadow-2xl text-center transform scale-90 transition-transform duration-500 max-w-md w-full mx-4 relative overflow-hidden"
            id="completion-modal">
            <div class="checkmark-wrapper mb-6">
                <svg class="checkmark" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 52 52">
                    <circle class="checkmark__circle" cx="26" cy="26" r="25" fill="none" />
                    <path class="checkmark__check" fill="none" d="M14.1 27.2l7.1 7.2 16.7-16.8" />
                </svg>
            </div>
            <h2 class="text-3xl font-black text-gray-800 mb-2 animate-bounce">太棒了！100分！</h2>
            <p class="text-gray-600 text-lg mb-8 font-bold">你學會了所有的生活好習慣！</p>
            <button onclick="closeOverlay()"
                class="w-full bg-indigo-600 text-white text-lg px-6 py-4 rounded-2xl font-black hover:bg-indigo-700 transition shadow-lg transform hover:scale-105 active:scale-95">
                關閉並再試一次
            </button>
        </div>
    </div>

    <div class="max-w-3xl w-full">
        <!-- 頂部頁首與進度條 -->
        <header class="text-center mb-8 mt-4">
            <div class="inline-block p-1 rounded-full bg-gradient-to-r from-indigo-500 via-blue-500 to-emerald-500 mb-4 shadow-md">
                <div class="bg-white rounded-full px-6 py-2">
                    <span class="text-transparent bg-clip-text bg-gradient-to-r from-indigo-600 to-blue-600 font-black tracking-wide uppercase text-sm">
                        日常生活素養練習
                    </span>
                </div>
            </div>
            <h1 class="text-3xl sm:text-4xl font-black text-gray-900 mb-2">生活好習慣互動組句</h1>
            <p class="text-lg text-gray-600 font-bold">請點選下方的詞語，組裝出正確又通順的句子吧！</p>

            <!-- 智慧型進度條 -->
            <div class="mt-6 max-w-sm mx-auto bg-white p-4 rounded-2xl shadow-sm border border-slate-100">
                <div class="h-4 bg-gray-200 rounded-full overflow-hidden">
                    <div id="progress-bar"
                        class="h-full bg-gradient-to-r from-indigo-500 to-blue-500 transition-all duration-500 ease-out"
                        style="width: 0%"></div>
                </div>
                <p class="text-sm font-bold text-gray-500 mt-2 text-center" id="progress-text">完成進度: 0/5</p>
            </div>
        </header>

        <!-- 句子題目卡片容器 -->
        <main id="exercises-container" class="space-y-8"></main>
    </div>

    <script>
        // 依照使用者提供內容原封不動生成，以詞彙拆分(包含標點符號，但發音會過濾)
        const exercises = [
            {
                id: 'ex1',
                prompt: '上完廁所後…',
                answer: '上完廁所後，我要用肥皂把手洗乾淨。',
                chunks: ['上完廁所後', '，', '我要', '用肥皂', '把手', '洗乾淨', '。']
            },
            {
                id: 'ex2',
                prompt: '吃東西以前…',
                answer: '吃東西以前，我要先洗手。',
                chunks: ['吃東西以前', '，', '我要', '先洗手', '。']
            },
            {
                id: 'ex3',
                prompt: '覺得身體不舒服的時候…',
                answer: '覺得身體不舒服的時候，我要馬上告訴老師。',
                chunks: ['覺得身體不舒服', '的時候', '，', '我要', '馬上', '告訴老師', '。']
            },
            {
                id: 'ex4',
                prompt: '我會自己拿水壺…',
                answer: '我會自己拿水壺，每天喝足夠的水。',
                chunks: ['我會自己', '拿水壺', '，', '每天喝', '足夠的水', '。']
            },
            {
                id: 'ex5',
                prompt: '打噴嚏或咳嗽時…',
                answer: '打噴嚏或咳嗽時，我要用衛生紙遮住嘴巴。',
                chunks: ['打噴嚏', '或咳嗽時', '，', '我要', '用衛生紙', '遮住嘴巴', '。']
            }
        ];

        let completedCount = 0;
        const totalCount = exercises.length;
        const synth = window.speechSynthesis;
        let renderedExercises = []; // 用於儲存隨機打亂後的題目順序

        function speak(text) {
            if (!text) return;
            synth.cancel(); // 中斷前一次發音

            // 判斷是否含有中文字元
            const hasChinese = /[\u4e00-\u9fa5]/.test(text);
            
            // 特教需求優化：過濾所有中英文標點符號以確保朗讀流暢無多餘停頓
            const cleanText = text.replace(/[，。！？：；,.?]/g, '').trim();
            if (cleanText.length === 0) return;

            const utterThis = new SpeechSynthesisUtterance(cleanText);
            
            // 語系判斷與特殊發音調校
            if (hasChinese) {
                utterThis.lang = 'zh-TW';
                utterThis.rate = 0.9; // 中文朗讀稍慢，符合特教學生需求
                utterThis.pitch = 1.05; // 略微明亮的音調
            } else {
                utterThis.lang = 'en-US';
                utterThis.rate = 0.8; // 英文發音慢速
                utterThis.pitch = 1.0;
            }

            synth.speak(utterThis);
        }

        function renderApp() {
            const container = document.getElementById('exercises-container');
            container.innerHTML = '';

            // 複製題目陣列，並隨機打亂題目的出現順序
            renderedExercises = [...exercises].sort(() => Math.random() - 0.5);

            renderedExercises.forEach((ex, index) => {
                const card = document.createElement('div');
                card.className = 'exercise-card p-6 sm:p-8';
                card.id = `card-${ex.id}`;
                card.dataset.id = ex.id;

                // 洗牌：隨機打亂單字 chunks 順序
                const shuffledWords = [...ex.chunks].sort(() => Math.random() - 0.5);

                card.innerHTML = `
                    <div class="mb-5 flex flex-wrap items-center justify-between gap-4">
                        <div class="flex items-center gap-3">
                            <span class="flex items-center justify-center w-10 h-10 rounded-full bg-indigo-100 text-indigo-700 font-extrabold text-lg border-2 border-indigo-200">
                                ${index + 1}
                            </span>
                            <h2 class="text-xl font-bold text-gray-800">${ex.prompt}</h2>
                        </div>
                        <button class="speaker-btn listen-ans-btn shadow-sm" data-text="${ex.answer.replace(/"/g, '&quot;')}" title="聽聽看整句發音">
                            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor" class="w-5 h-5 pointer-events-none">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M19.114 5.636a9 9 0 010 12.728M16.463 8.288a5.25 5.25 0 010 7.424M6.75 8.25l4.72-4.72a.75.75 0 011.28.53v15.88a.75.75 0 01-1.28.53l-4.72-4.72H4.51c-.88 0-1.704-.507-1.938-1.354A9.01 9.01 0 012.25 12c0-.83.112-1.633.322-2.396C2.806 8.756 3.63 8.25 4.51 8.25H6.75z" />
                            </svg>
                        </button>
                    </div>

                    <!-- 備選單字庫 -->
                    <div class="word-bank flex flex-wrap gap-2 mb-6 justify-center bg-slate-50 p-4 rounded-2xl border border-dashed border-slate-200" id="bank-${ex.id}">
                        ${shuffledWords.map(word => `<div class="word-item">${word}</div>`).join('')}
                    </div>

                    <!-- 作答投放區：使用 chinese-mode 緊密排列，文字相連更符合閱讀習慣 -->
                    <div class="drop-zone chinese-mode mb-5" id="zone-${ex.id}" data-placeholder="💡 請點選上方的卡片來組合句子"></div>

                    <!-- 動作與回饋區域 -->
                    <div class="flex flex-wrap items-center gap-3">
                        <button class="btn-action check-btn bg-indigo-600 hover:bg-indigo-700 text-white font-black py-3 px-8 rounded-2xl shadow-md transition-all text-base flex-grow sm:flex-grow-0" data-id="${ex.id}">檢查答案</button>
                        <button class="btn-action reset-btn bg-white hover:bg-slate-50 text-gray-600 border-2 border-slate-200 font-bold py-3 px-6 rounded-2xl transition-all text-base" data-id="${ex.id}">重新排列</button>
                        <div class="feedback-msg ml-auto font-black text-lg flex items-center"></div>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        document.body.addEventListener('click', (e) => {
            const target = e.target;

            // 1. 單字卡片點擊移動與自動發音
            if (target.classList.contains('word-item')) {
                const card = target.closest('.exercise-card');
                if (!card) return;
                const exId = card.dataset.id;
                const bank = document.getElementById(`bank-${exId}`);
                const zone = document.getElementById(`zone-${exId}`);

                // 自動發音
                speak(target.innerText);

                // 搬移元素位置
                if (target.parentElement === bank) {
                    zone.appendChild(target);
                } else {
                    bank.appendChild(target);
                }

                // 清除之前的判定狀態與回饋文字
                const feedbackEl = card.querySelector('.feedback-msg');
                feedbackEl.innerHTML = '';
                zone.classList.remove('correct', 'incorrect');
                return;
            }

            // 2. 檢查答案按鈕
            if (target.classList.contains('check-btn')) {
                checkAnswer(target.dataset.id);
                return;
            }

            // 3. 重置按鈕
            if (target.classList.contains('reset-btn')) {
                resetQuestion(target.dataset.id);
                return;
            }

            // 4. 整句朗讀喇叭按鈕
            if (target.closest('.listen-ans-btn')) {
                speak(target.closest('.listen-ans-btn').dataset.text);
                return;
            }
        });

        function checkAnswer(id) {
            const zone = document.getElementById(`zone-${id}`);
            const card = document.getElementById(`card-${id}`);
            const feedbackEl = card.querySelector('.feedback-msg');
            const exData = exercises.find(e => e.id === id);

            const rawWords = Array.from(zone.children).map(el => el.innerText);
            
            // 國文題目將文字直接緊密連接拼湊
            let userSentence = rawWords.join('');
            let correctAnswer = exData.answer;

            if (userSentence === correctAnswer) {
                feedbackEl.innerHTML = '<span class="text-emerald-600 flex items-center gap-2">🎉 答對了！你真棒！</span>';
                zone.classList.remove('incorrect');
                zone.classList.add('correct');
                speak("答對了，太棒了！");

                if (!zone.dataset.completed) {
                    zone.dataset.completed = 'true';
                    updateProgress(1);
                }
            } else {
                feedbackEl.innerHTML = '<span class="text-red-500 flex items-center gap-2">🤔 好像不對，再讀讀看喔？</span>';
                zone.classList.remove('correct');
                zone.classList.add('incorrect');
                speak("再試試看喔");
                
                // 觸發抖動動畫效果
                zone.style.animation = 'none';
                zone.offsetHeight; /* 觸發重繪 */
                zone.style.animation = null;
            }
        }

        function resetQuestion(id) {
            const bank = document.getElementById(`bank-${id}`);
            const zone = document.getElementById(`zone-${id}`);
            const card = document.getElementById(`card-${id}`);
            const feedbackEl = card.querySelector('.feedback-msg');

            // 將作答區卡片全部搬回單字庫
            Array.from(zone.children).forEach(child => bank.appendChild(child));
            
            // 重新隨機洗牌單字庫中的卡片順序
            const words = Array.from(bank.children);
            words.sort(() => Math.random() - 0.5);
            words.forEach(w => bank.appendChild(w));

            feedbackEl.innerHTML = '';
            zone.classList.remove('correct', 'incorrect');
            
            if (zone.dataset.completed) {
                delete zone.dataset.completed;
                updateProgress(-1);
            }
        }

        function updateProgress(change) {
            completedCount += change;
            completedCount = Math.max(0, Math.min(completedCount, totalCount));
            const percentage = Math.round((completedCount / totalCount) * 100);
            
            const bar = document.getElementById('progress-bar');
            const text = document.getElementById('progress-text');
            
            bar.style.width = `${percentage}%`;
            text.textContent = `完成進度: ${completedCount}/${totalCount}`;

            // 當全部作答正確，觸發終極成就慶祝
            if (completedCount === totalCount) {
                bar.classList.remove('from-indigo-500', 'to-blue-500');
                bar.classList.add('from-emerald-400', 'to-emerald-500');
                setTimeout(() => {
                    showOverlay();
                }, 600);
            } else {
                bar.classList.add('from-indigo-500', 'to-blue-500');
                bar.classList.remove('from-emerald-400', 'to-emerald-500');
            }
        }

        function showOverlay() {
            const overlay = document.getElementById('completion-overlay');
            const modal = document.getElementById('completion-modal');
            overlay.classList.remove('hidden');
            
            setTimeout(() => {
                overlay.classList.remove('opacity-0');
                modal.classList.remove('scale-90');
                modal.classList.add('scale-100');
                
                // 播放完成通知音效語音
                speak("太棒了！100分！你已經學會了所有的生活好習慣！");

                // 產生 60 片隨機顏色、飄落速度的五彩碎紙，建立強烈的成就回饋感
                for (let i = 0; i < 60; i++) {
                    createConfetti(overlay);
                }
            }, 50);
        }

        window.closeOverlay = function () {
            const overlay = document.getElementById('completion-overlay');
            const modal = document.getElementById('completion-modal');
            
            overlay.classList.add('opacity-0');
            modal.classList.remove('scale-100');
            modal.classList.add('scale-90');
            
            setTimeout(() => {
                overlay.classList.add('hidden');
                document.querySelectorAll('.confetti').forEach(c => c.remove());
                
                // 重置完成題數，並重新隨機排序生成所有題目，提供重複練習與全新挑戰
                completedCount = 0;
                updateProgress(0); 
                renderApp();
            }, 500);
        }

        function createConfetti(container) {
            const confetti = document.createElement('div');
            confetti.classList.add('confetti');
            const colors = ['#ef4444', '#3b82f6', '#10b981', '#f59e0b', '#8b5cf6', '#ec4899', '#06b6d4'];
            confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
            confetti.style.left = Math.random() * 100 + 'vw';
            confetti.style.animationDuration = (Math.random() * 2 + 1.5) + 's'; // 1.5-3.5s
            confetti.style.opacity = Math.random() * 0.7 + 0.3;
            confetti.style.width = (Math.random() * 8 + 8) + 'px';
            confetti.style.height = (Math.random() * 8 + 8) + 'px';
            container.appendChild(confetti);
        }

        // 初始化渲染應用程式（包含首次隨機排列）
        renderApp();
    </script>
</body>
</html>
