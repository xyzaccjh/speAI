<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>社會技巧｜生活習慣與責任行為｜第11–15週</title><style>

x;padding:7px 15px;font-weight:700}.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.step{background:#eff8fa;border:1px solid var(--edge);border-radius:15px;padding:15px}.step b{color:var(--teal2)}.options{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.choice{display:flex;align-items:center;gap:10px;text-align:left;padding:13px 15px;background:white;border:2px solid var(--edge);border-radius:14px;color:var(--ink);min-height:72px}.choice .emoji{font-size:34px}.choice.selected{border-color:var(--teal);background:#e2f5f6}.choice.good{border-color:var(--green);background:#e8f8f0}.choice.bad{border-color:#d18f54;background:#fff4e7}.choice:disabled{opacity:.8}.primary,.secondary,.danger{border:0;border-radius:12px;padding:10px 17px;font-weight:750}.primary{background:var(--teal);color:white}.secondary{background:#dfedf1;color:var(--teal2)}.danger{background:#f8e7e5;color:#8c403b}.feedback{padding:12px;border-radius:12px;border:1px solid var(--edge);margin-top:12px;background:#edf6f8;min-height:48px}.feedback.success{background:#e7f6ed;border-color:#9bcfb2}.feedback.retry{background:#fff4e3;border-color:#e4c28a}.field{display:block;width:100%;border:2px solid #a9cbd4;border-radius:11px;padding:11px 13px;background:#fff;margin:6px 0 12px;min-height:47px}.rowgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.taskline{display:flex;align-items:center;gap:8px;background:#f1f8fa;padding:10px 12px;border-radius:10px;margin:8px 0}.taskline input[type=checkbox]{width:23px;height:23px;accent-color:var(--teal);flex-shrink:0}.taskline span{flex:1}.weeklog{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.day{padding:13px 5px;border:1px solid var(--edge);border-radius:13px;background:#f4fbfc;text-align:center}.day button{display:block;margin:9px auto 0;width:66px;height:48px;background:#fff;border:2px solid var(--edge);border-radius:9px;font-size:23px}.day button:focus-visible{outline:3px solid var(--gold)}.scenario{border:1px solid var(--edge);padding:15px;border-radius:15px;margin:13px 0;background:#fafefe}.scenario-title{font-size:19px;font-weight:800;margin-bottom:10px}.three{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.smallchoice{border:2px solid var(--edge);background:white;padding:12px;border-radius:12px;min-height:68px;text-align:left;color:var(--ink)}.smallchoice.picked{background:#e2f4f6;border-color:var(--teal)}.smallchoice.correct{border-color:var(--green);background:#e5f6eb}.smallchoice.wrong{border-color:#e1a666;background:#fff4e5}.footerbar{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin:20px 0 40px}.teacher{border:1px dashed #97c8d1}.teacher summary{cursor:pointer;font-weight:800;color:var(--teal2);font-size:19px}.teacher ol{padding-left:22px}.teacher li{margin:6px 0}.printhead{display:none}.skip{position:absolute;top:-100px;left:10px;background:white;padding:10px;z-index:10}.skip:focus{top:10px}.bigicon{font-size:45px}.meters{display:flex;gap:5px;align-items:center}.meters>div{background:#dcecef;width:40px;height:9px;border-radius:5px}.meters>div.on{background:var(--green)}.score{font-size:15px;font-weight:700;color:var(--teal2)}.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}@media(max-width:700px){.weeks{grid-template-columns:repeat(5,135px);overflow:auto;padding-bottom:8px}.steps,.rowgrid,.three{grid-template-columns:1fr}.options{grid-template-columns:1fr}.weeklog{grid-template-columns:repeat(5,minmax(60px,1fr))}.shell{padding:12px}.card{border-radius:14px}body{font-size:16px}header{padding:20px}}@media print{body{background:white;font-size:13px}header{color:black;background:none;padding:0}header h1{font-size:22px}.shell{padding:0}.weeks,.footerbar,.teacher,.noprint,.skip{display:none!important}.card{box-shadow:none;break-inside:avoid;border-radius:0;padding:10px 0;margin:8px 0}.printhead{display:block}.choice,.smallchoice,.day{break-inside:avoid}.feedback{min-height:25px}}
</style></head><body><a class="skip" href="#content">跳到教學內容</a><header><div class="topline">115學年度・國中資源班・社會技巧</div><h1>生活習慣與責任行為 <span style="font-size:.55em">互動教學</span></h1><p>第11–15週｜選擇責任 → 分步執行 → 完成檢查 → 補救調整 → 一週挑戰</p></header><main class="shell" id="content"><nav class="weeks" aria-label="選擇教學週次" id="weeks"></nav><div class="flex space"><span id="progress" class="pill" aria-live="polite">第11週</span><div class="flex noprint"><button class="secondary" id="teacherToggle">👩‍🏫 教師教學提示</button><button class="secondary" onclick="window.print()">🖨️ 列印本週</button></div></div><section id="lesson" aria-live="polite"></section><details class="card teacher" id="teacherNotes"><summary>👩‍🏫 本週教師教學提示與評量</summary><div id="teacherContent"></div></details><div class="footerbar noprint"><button class="secondary" id="prev">← 上一週</button><span class="hint">操作記錄只儲存在這台裝置的瀏覽器</span><button class="primary" id="next">下一週 →</button></div><div class="noprint" style="text-align:right;margin-bottom:20px"><button class="danger" id="clear">清除此網頁的學習紀錄</button></div></main><script>
'use strict';
const DATA=[
{w:11,title:'我的責任有哪些？',goal:'能選擇一項每日生活任務目標',time:[5,10,10,15,10],flow:['情境暖身','認識生活責任','互動選擇','建立個人任務','檢核與分享'],notes:['先讓學生區分自己可以處理的事情與需要協助的事情；強調負責任不等於全部獨自完成。','示範：整理書包、帶齊用品、完成作業、歸還借用品。','評量：能選出一項責任目標並說出或指出自己需要的協助。','七年級情緒障礙學生可先從兩個可接受的選項中選擇，不強制公開分享。']},
{w:12,title:'把事情做好有步驟',goal:'能將一項任務拆成步驟並依序執行',time:[5,10,10,15,10],flow:['觀察示範','學會三步驟','排序小測驗','安排自己的步驟','任務自我檢核'],notes:['示範「整理書包」：看課表、放課本、再確認。','支持程度可分為教師示範、視覺提示、口頭提示、獨立操作。','評量：在適當提示下依序完成一項任務，記錄使用的提示類型。','避免只以完成速度評估，先肯定依照順序執行。']},
{w:13,title:'做完了，還要檢查',goal:'能依檢核表檢查至少一項任務',time:[5,10,10,15,10],flow:['比較完成與檢查','檢查常見項目','情境判斷','使用檢查清單','自我回饋'],notes:['說明「完成」不等於「檢查」，示範作業做完卻忘了放進書包的例子。','學生不需一次檢查所有項目，可先選最有意義的一至兩項。','評量：能查看清單、勾選並在發現遺漏時補做。','使用「還要再看」替代「你做錯了」，減少威脅感。']},
{w:14,title:'忘記了、沒做到怎麼辦？',goal:'能辨識未完成的影響並選擇可行的補救方式',time:[5,10,15,10,10],flow:['情境導入','認識行為後果','三題情境選擇','練習三句話','選擇提醒方式'],notes:['先讓學生知道「沒完成」可被描述、可被補救，避免道德化責備。','練習「說明狀況 → 選擇補救 → 安排下次提醒」。','若遇到拒絕回答或情緒升高，允許先指選項、暫停或改採個別回應。','評量：三個情境能選擇適當補救並練習一句說明句型。']},
{w:15,title:'我的責任挑戰',goal:'能設定任務、記錄執行並提出調整方法',time:[5,10,10,15,10],flow:['回顧前四週','設定本週任務','練習記錄方式','回顧與調整','成果分享'],notes:['本週網頁可以每天開啟，讓學生用✔、△、○記錄週一至週五。','如果尚未到週五，不必要求學生填寫未發生的日子。','評量三向度：選擇目標、執行步驟、自我檢核／調整。','支持學生使用選項作答；尊重不願公開分享的學生。']}
];
const tasks=[['🎒','整理書包'],['✏️','帶齊上課用品'],['📖','完成指定作業'],['🪑','整理座位與桌面'],['📚','歸還借用物品']];
const reminders=[['🗣️','老師口頭提醒'],['📋','桌上步驟提示'],['⏲️','計時器提醒'],['🤝','同學或老師協助']];
let week=11,store={};try{store=JSON.parse(localStorage.getItem('socskills_115_unit3')||'{}')}catch(e){store={}};
function save(){try{localStorage.setItem('socskills_115_unit3',JSON.stringify(store))}catch(e){}}
function val(k,d=''){return Object.prototype.hasOwnProperty.call(store,k)?store[k]:d}function set(k,v){store[k]=v;save()}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function el(id){return document.getElementById(id)}
function btnOpt(label,icon,key){return `<button type="button" class="choice ${val(key)===label?'selected':''}" data-key="${esc(key)}" data-value="${esc(label)}"><span class="emoji" aria-hidden="true">${icon}</span><span>${esc(label)}</span></button>`}
function inp(label,key,placeholder='請輸入或由老師協助填寫'){return `<label>${label}<input class="field" data-input="${esc(key)}" value="${esc(val(key))}" placeholder="${esc(placeholder)}" /></label>`}
function check(label,key){return `<label class="taskline"><input type="checkbox" data-check="${esc(key)}" ${val(key)?'checked':''}><span>${esc(label)}</span></label>`}
function card(title,body,extra=''){return `<article class="card ${extra}"><h2>${title}</h2>${body}</article>`}
function feedback(id){return `<div id="${id}" class="feedback" role="status" aria-live="polite">請選擇答案，完成後就能看到說明。</div>`}
function scenario(id,title,choices,answer,reason){let k='s14_'+id,selected=val(k,'');return `<div class="scenario"><div class="scenario-title">${title}</div><div class="three">${choices.map((s,i)=>`<button type="button" class="smallchoice ${selected===String(i)?'picked':''}" data-quiz="${k}" data-index="${i}">${i+1}. ${esc(s)}</button>`).join('')}</div><div class="feedback ${selected===''?'':selected===String(answer)?'success':'retry'}" role="status" aria-live="polite" id="result_${id}">${selected===''?'選擇你覺得最合適的做法。':selected===String(answer)?'✅ 這是可行的補救方式。'+reason:'💡 再想想：先說明狀況，再採取可行的補救行動。'}</div></div>`}
function section11(){return card('① 暖身｜哪些事是我的責任？',`<p>你不需要每件事都自己完成，但可以試著選擇一件自己能參與的事。</p><div class="options">${tasks.map(([e,t])=>btnOpt(t,e,'w11task')).join('')}${btnOpt('其他自訂','💬','w11task')}</div><div class="note" id="task11note">${val('w11task')?'我選擇：'+esc(val('w11task')):'請選擇一個目標。'}</div>`)+card('② 想一想｜我為什麼選這件事？',`<div class="options">${[['🔔','我常常忘記'],['👩‍🏫','老師曾提醒我'],['🌱','我想更進步'],['🎯','我自己想挑戰']].map(([e,t])=>btnOpt(t,e,'w11reason')).join('')}</div>`)+card('③ 實作｜把事情分成三步',`<p class="hint">示範：整理書包 → 看課表 → 放入課本 → 再檢查一次。</p><div class="rowgrid">${['先做','接著','最後'].map((t,i)=>`<div class="step"><b>${i+1}. ${t}</b>${inp('我要做：','w11step'+i)}</div>`).join('')}</div>`)+card('④ 自我提醒｜哪一種方法對我有幫助？',`<div class="options">${reminders.map(([e,t])=>btnOpt(t,e,'w11reminder')).join('')}</div>`)+card('⑤ 今日小結｜我做得怎麼樣？',`<div class="options">${[['✅','我完成了'],['🟡','我完成一部分'],['🤝','我還需要幫助']].map(([e,t])=>btnOpt(t,e,'w11end')).join('')}</div><p class="note">重點：願意開始、知道怎麼求助，也是一種負責任的表現。</p>`)}
function section12(){return card('① 今天的任務｜先選一件事',`<div class="options">${tasks.slice(0,4).map(([e,t])=>btnOpt(t,e,'w12task')).join('')}</div>`)+card('② 看圖學策略｜三步驟',`<div class="steps"><div class="step"><div class="bigicon">📅</div><h3>1 先做</h3><p>看課表，確認需要什麼。</p></div><div class="step"><div class="bigicon">📚</div><h3>2 接著</h3><p>把需要的課本和用品放入書包。</p></div><div class="step"><div class="bigicon">🎒</div><h3>3 最後</h3><p>再看一次，確定帶齊。</p></div></div>`)+card('③ 互動排序｜把步驟排對',`<p>整理書包的第一步應該做什麼？</p><div class="options">${[['🎒','把書包拉起來'],['📅','先看課表'],['🏃','直接離開'],['📱','先玩手機']].map(([e,t])=>btnOpt(t,e,'w12quiz')).join('')}</div><div class="feedback ${val('w12quiz')?(val('w12quiz')==='先看課表'?'success':'retry'):''}" id="w12feedback" role="status">${!val('w12quiz')?'請選擇。':val('w12quiz')==='先看課表'?'✅ 正確！先確認需求，再收拾物品。':'💡 想想看：先確認今天上什麼課，才知道要帶什麼。'}</div>`)+card('④ 輪到我｜安排自己的三個步驟',`<div class="rowgrid">${['先做','接著','最後'].map((t,i)=>`<div class="step"><b>${i+1}. ${t}</b>${inp('我會：','w12step'+i)}</div>`).join('')}</div>`)+card('⑤ 完成後檢查',`${['有照順序做','把東西放回適當位置','完成後再看一次','有需要時主動求助'].map((t,i)=>check(t,'w12check'+i)).join('')}<div class="options">${[['🌟','我自己完成'],['🔔','提醒後完成'],['🌱','我還需要練習']].map(([e,t])=>btnOpt(t,e,'w12end')).join('')}</div>`)}
function section13(){return card('① 想一想｜完成和檢查一樣嗎？',`<div class="steps" style="grid-template-columns:repeat(2,1fr)"><div class="step"><div class="bigicon">✍️</div><h3>完成</h3>我把事情做完。</div><div class="step"><div class="bigicon">🔍</div><h3>檢查</h3>我再看一次，有沒有遺漏。</div></div><p class="note">完成作業後，還要確認是否已放進書包。</p>`)+card('② 情境快問快答',`<p>你已經寫完作業，但還沒放進書包。接下來怎麼做？</p><div class="options">${[['🚪','直接離開'],['🎒','再確認並放進書包'],['😤','不用理會'],['📺','先做別的事']].map(([e,t])=>btnOpt(t,e,'w13quiz')).join('')}</div><div class="feedback ${val('w13quiz')?(val('w13quiz')==='再確認並放進書包'?'success':'retry'):''}" role="status">${!val('w13quiz')?'請選擇。':val('w13quiz')==='再確認並放進書包'?'✅ 沒錯！檢查能幫助我們發現還沒完成的步驟。':'💡 試著再看一次：作業寫完了，還有什麼事情沒有完成？'}</div>`)+card('③ 我的檢查清單',`<p>選擇你今天需要檢查的事項。</p>${['看課表','帶課本','作業放進書包','桌面收乾淨','借用品還回去'].map((t,i)=>check(t,'w13check'+i)).join('')}`)+card('④ 發現還沒做好時',`<div class="options">${[['💭','我忘記了'],['🟨','我做了一半'],['⏩','我太急了'],['❔','我不知道下一步']].map(([e,t])=>btnOpt(t,e,'w13problem')).join('')}</div>${inp('我可以怎麼補救？','w13fix','例如：看清單後補做')}`)+card('⑤ 今日回饋',`<div class="options">${[['🔍','我自己檢查到了'],['👩‍🏫','提醒後才發現'],['🌱','下次我會再檢查']].map(([e,t])=>btnOpt(t,e,'w13end')).join('')}</div>`)}
function section14(){return card('① 情境判斷｜選擇最合適的補救方法',scenario('a','📖 A. 上課時發現自己忘記帶課本。',['不管它','向老師說明並詢問方法','生氣不做'],1,'能先獲得協助，也能安排下次提醒。')+scenario('b','🤝 B. 借用同學物品，卻忘記歸還。',['找到物品並歸還','假裝沒發生','說是別人的錯'],0,'讓物品回到原本的主人手上。')+scenario('c','📝 C. 作業還沒完成，老師要收了。',['說明狀況並請求補交','躲起來','隨便交出去'],0,'清楚說明並和老師確認可行方式。'))+card('② 補救三步驟',`<div class="steps"><div class="step"><div class="bigicon">💬</div><h3>1 說明狀況</h3>說清楚現在的情況。</div><div class="step"><div class="bigicon">🛠️</div><h3>2 想補救辦法</h3>選擇自己能做到的方式。</div><div class="step"><div class="bigicon">📅</div><h3>3 下次提醒</h3>減少下一次忘記的機會。</div></div>`)+card('③ 我可以怎麼說？',`${inp('我還沒完成，因為……','w14say1')}${inp('我現在可以……','w14say2')}${inp('下次我會……','w14say3')}<div class="flex"><button class="secondary" id="example14" type="button">👀 顯示一句示範</button></div><div id="exampleText" class="note" hidden>例如：「我今天忘記帶課本，我先跟老師說明，下次出門前看課表檢查。」</div>`)+card('④ 我的提醒方法',`<div class="options">${[['📒','寫在聯絡簿'],['👩‍🏫','請老師提醒'],['🤝','請同學提醒'],['🏠','回家先完成']].map(([e,t])=>btnOpt(t,e,'w14reminder')).join('')}</div>`)+card('⑤ 今天學到什麼？',`${check('我知道怎麼說明狀況','w14end1')}${check('我知道怎麼選補救方法','w14end2')}${check('我願意下次再試','w14end3')}`)}
function section15(){const day=['一','二','三','四','五'];let log=['✔','△','○'];return card('① 設定這週的責任挑戰',`${inp('我的任務：','w15goal','例如：每天放學前整理書包')}<div class="note"><b>紀錄符號：</b> ✔ 已完成　 △ 完成一部分　 ○ 需要幫助<br><span class="hint">不必預先填寫尚未發生的日子。</span></div>`)+card('② 一週挑戰｜每天按一下記錄',`<div class="weeklog">${day.map((d,i)=>`<div class="day"><b>星期${d}</b><button type="button" aria-label="星期${d}，目前${val('w15d'+i,'未紀錄')}，按一下切換" data-day="${i}">${esc(val('w15d'+i,'＋'))}</button></div>`).join('')}</div><p class="hint">按一下依序切換：＋ → ✔ → △ → ○ → ＋。記錄沒有分數，也不公開排名。</p>`)+card('③ 這週我遇到的狀況',`<div class="options">${[['💭','忘記了'],['🔔','需要提醒'],['🟨','做到一半'],['❔','不知道怎麼開始'],['✅','我有完成']].map(([e,t])=>btnOpt(t,e,'w15situation')).join('')}</div>`)+card('④ 下次可以怎麼調整？',`<div class="rowgrid"><div class="step"><b>1 我先做什麼</b>${inp('我的行動：','w15adj1')}</div><div class="step"><b>2 我需要什麼提醒</b>${inp('我的提醒：','w15adj2')}</div><div class="step"><b>3 下次想怎麼做</b>${inp('我的做法：','w15adj3')}</div></div>`)+card('⑤ 回顧我的進步',`${inp('這週我做得好的一件事：','w15good')}${inp('下週我想繼續練習：','w15next')}<div class="options">${[['🌟','我能自己完成'],['🔔','提醒後可以完成'],['🌱','我需要更多練習']].map(([e,t])=>btnOpt(t,e,'w15end')).join('')}</div><div class="note">每個人進步的速度不同。能找到下一次可以使用的策略，就是重要的學習成果。</div>`)}
function render(scroll=false){let d=DATA.find(x=>x.w===week);el('weeks').innerHTML=DATA.map(x=>`<button type="button" class="weekbtn ${x.w===week?'active':''}" data-week="${x.w}" aria-current="${x.w===week?'step':'false'}">第${x.w}週<small>${x.title}</small></button>`).join('');el('progress').textContent='第'+week+'週｜'+d.goal;el('lesson').innerHTML=`<div class="printhead">社會技巧｜第一學期第三單元｜第${week}週</div>${card('📌 本週主題｜'+d.title,`<p><b>本週目標：</b>${d.goal}</p><div class="stage">${d.flow.map((s,i)=>`<span>${i+1}. ${s}（${d.time[i]}分）</span>`).join('')}</div><p class="hint">本週教學時間：50分鐘。依學生狀態調整活動節奏；學生可用指認、勾選或口語回應。</p>`)}`+({11:section11,12:section12,13:section13,14:section14,15:section15}[week]());el('teacherContent').innerHTML=`<p><b>建議流程：</b>${d.flow.map((s,i)=>`${s} ${d.time[i]}分鐘`).join(' → ')}</p><ol>${d.notes.map(s=>'<li>'+esc(s)+'</li>').join('')}</ol>`;el('prev').disabled=week===11;el('next').disabled=week===15;if(scroll)window.scrollTo({top:0,behavior:'smooth'});}
document.addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;if(b.dataset.week){week=Number(b.dataset.week);render(true);return}if(b.dataset.key){set(b.dataset.key,b.dataset.value);render();return}if(b.dataset.quiz){set(b.dataset.quiz,b.dataset.index);render();return}if(b.dataset.day!==undefined){let k='w15d'+b.dataset.day;let a=['＋','✔','△','○'],i=a.indexOf(val(k,'＋'));set(k,a[(i+1)%a.length]);render();return}if(b.id==='example14'){let a=el('exampleText');a.hidden=!a.hidden;return}});
document.addEventListener('input',e=>{if(e.target.matches('[data-input]'))set(e.target.dataset.input,e.target.value)});
document.addEventListener('change',e=>{if(e.target.matches('[data-check]'))set(e.target.dataset.check,e.target.checked)});
el('prev').onclick=()=>{if(week>11){week--;render(true)}};el('next').onclick=()=>{if(week<15){week++;render(true)}};el('teacherToggle').onclick=()=>{let t=el('teacherNotes');t.open=!t.open;t.scrollIntoView({behavior:'smooth',block:'nearest'})};el('clear').onclick=()=>{if(confirm('確定要清除這個網頁儲存的所有第11–15週學習紀錄嗎？')){store={};save();render()}};render();
</script></body></html>
