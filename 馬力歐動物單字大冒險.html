<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>瑪利歐動物單字大冒險 - Mario Vocab Adventure</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Noto+Sans+TC:wght@500;700;900&display=swap" rel="stylesheet">
  
  <style>
    body {
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
      font-family: 'Noto Sans TC', sans-serif;
      background-color: #1a1a2e;
    }
    .pixel-font {
      font-family: 'Press Start 2P', monospace;
    }
    .pixel-border {
      box-shadow: 
        0 -4px 0 0 #000,
        0 4px 0 0 #000,
        -4px 0 0 0 #000,
        4px 0 0 0 #000;
    }
    .retro-btn {
      transition: transform 0.05s ease;
      box-shadow: 0 5px 0 #b33939;
    }
    .retro-btn:active {
      transform: translateY(4px);
      box-shadow: 0 1px 0 #b33939;
    }
    /* Flashing transformation effect */
    @keyframes marioFlash {
      0%, 100% { opacity: 1; filter: drop-shadow(0 0 10px #ffeaa7); }
      50% { opacity: 0.3; filter: drop-shadow(0 0 20px #ff7675); }
    }
    .transforming {
      animation: marioFlash 0.15s ease-in-out infinite;
    }
  </style>
</head>
<body class="w-screen h-screen overflow-hidden flex flex-col justify-between items-center text-white select-none">

  <header class="w-full max-w-4xl px-3 py-2 flex flex-col items-center z-10">
    <div class="w-full flex justify-between items-center bg-slate-900/80 backdrop-blur px-4 py-2 rounded-xl border-2 border-yellow-400 shadow-lg">
      <div class="flex items-center space-x-2">
        <span class="text-xl">🍄</span>
        <div>
          <div class="text-[10px] text-gray-400 pixel-font">MARIO SIZE</div>
          <div id="size-label" class="text-xs font-bold text-yellow-300 pixel-font">NORMAL</div>
        </div>
      </div>

      <!-- Current Word Mission Banner -->
      <div class="flex items-center space-x-3 bg-red-600/90 px-4 py-1.5 rounded-lg border border-yellow-300">
        <span class="text-xs text-yellow-200 font-bold">🎯 目標目標:</span>
        <span id="target-emoji" class="text-2xl animate-bounce">🐱</span>

      <div class="flex items-center space-x-4">

        <div class="text-right">
          <div class="text-[10px] text-gray-400 pixel-font">LIVES</div>

  <main class="relative w-full max-w-4xl flex-1 flex justify-center items-center px-2">
    <div class="relative w-full h-full max-h-[520px] rounded-2xl overflow-hidden border-4 border-slate-700 bg-sky-300 shadow-2xl">
      <canvas id="gameCanvas" class="w-full h-full block"></canvas>

      <!-- Overlay: Start / Game Over Modal -->
      <div id="overlay-modal" class="absolute inset-0 bg-black/75 backdrop-blur-sm flex flex-col justify-center items-center p-6 text-center z-20">

          跳躍撞擊磚塊上的英文單字！<br>
          ✨ 撞對目標單字：瑪利歐<span class="text-green-400 font-bold">變大升級</span>獲得高分！<br>
          ⚡ 撞錯錯誤單字：瑪利歐<span class="text-red-400 font-bold">縮小退化</span>扣除愛心！

        <button id="start-btn" class="px-8 py-3 bg-red-600 hover:bg-red-500 text-white font-bold text-lg rounded-xl pixel-font border-2 border-yellow-300 shadow-lg cursor-pointer transform hover:scale-105 active:scale-95 transition-all">

      <!-- In-game Notification Banner -->

        <span id="toast-icon">✨</span>

  <footer class="w-full max-w-4xl px-4 py-3 flex justify-between items-center z-10 sm:hidden">
    <!-- D-Pad Left/Right -->
    <div class="flex gap-3">

  <!-- Desktop keyboard tips footer -->
  <div class="hidden sm:flex w-full max-w-4xl py-2 px-4 justify-between items-center text-xs text-gray-400">
    <div>鍵盤操作：<span class="text-yellow-400 font-bold">A/D</span> 或 <span class="text-yellow-400 font-bold">← / →</span> 移動，<span class="text-yellow-400 font-bold">Space / W / ↑</span> 跳躍撞擊磚塊！</div>
    <div class="flex items-center gap-2">
      <span class="inline-block w-3 h-3 rounded-full bg-green-500"></span>
      音效狀態: Web Audio 合成器已就緒
    </div>
  </div>

  <script>
    const SoundEngine = {
      ctx: null,
      init() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          this.ctx = new AudioContext();
        }
        if (this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      },
      playTone(freq, type = 'square', duration = 0.1, gainVal = 0.15) {
        if (!this.ctx) return;
        try {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = type;
          osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
          gain.gain.setValueAtTime(gainVal, this.ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + duration);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start();
          osc.stop(this.ctx.currentTime + duration);
        } catch (e) {
          console.warn("Audio play issue", e);
        }
      },
      jump() {
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'square';
        osc.frequency.setValueAtTime(150, now);
        osc.frequency.exponentialRampToValueAtTime(600, now + 0.15);
        gain.gain.setValueAtTime(0.12, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.15);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.15);
      },
      hit() {
        this.playTone(180, 'triangle', 0.1, 0.2);
      },
      powerUp() {
        if (!this.ctx) return;
        const notes = [330, 392, 659, 523, 587, 784];
        notes.forEach((freq, idx) => {
          setTimeout(() => {
            this.playTone(freq, 'square', 0.1, 0.18);
          }, idx * 60);
        });
      },
      shrink() {
        if (!this.ctx) return;
        const notes = [600, 480, 380, 240, 150];
        notes.forEach((freq, idx) => {
          setTimeout(() => {
            this.playTone(freq, 'sawtooth', 0.12, 0.2);
          }, idx * 70);
        });
      },
      gameOver() {
        if (!this.ctx) return;
        const notes = [500, 450, 400, 350, 250, 180];
        notes.forEach((freq, idx) => {
          setTimeout(() => {
            this.playTone(freq, 'sawtooth', 0.2, 0.25);
          }, idx * 100);
        });
      }
    };

    const ANIMAL_WORDS = [
      { en: "CAT", zh: "貓咪", emoji: "🐱" },
      { en: "DOG", zh: "小狗", emoji: "🐶" },
      { en: "LION", zh: "獅子", emoji: "🦁" },
      { en: "ELEPHANT", zh: "大象", emoji: "🐘" },
      { en: "MONKEY", zh: "猴子", emoji: "🐵" },
      { en: "RABBIT", zh: "兔子", emoji: "🐰" },
      { en: "PANDA", zh: "熊貓", emoji: "🐼" },
      { en: "TIGER", zh: "老虎", emoji: "🐯" },
      { en: "BEAR", zh: "棕熊", emoji: "🐻" },
      { en: "FROG", zh: "青蛙", emoji: "🐸" },
      { en: "DUCK", zh: "鴨子", emoji: "🦆" },
      { en: "PENGUIN", zh: "企鵝", emoji: "🐧" },
      { en: "FOX", zh: "狐狸", emoji: "🦊" },
      { en: "COW", zh: "乳牛", emoji: "🐮" },
      { en: "PIG", zh: "小豬", emoji: "🐷" },
      { en: "HORSE", zh: "馬", emoji: "🐴" },
      { en: "SHEEP", zh: "綿羊", emoji: "🐑" },
      { en: "GIRAFFE", zh: "長頸鹿", emoji: "🦒" },
      { en: "ZEBRA", zh: "斑馬", emoji: "🦓" },
      { en: "KOALA", zh: "無尾熊", emoji: "🐨" }
    ];

    // Mario Size State Definitions
    const SIZES = {
      MINI: { name: "MINI 🍄-", scale: 0.7, width: 24, height: 32, maxSpeed: 4.8, jumpForce: -11 },
      NORMAL: { name: "NORMAL 👨", scale: 1.0, width: 32, height: 44, maxSpeed: 4.5, jumpForce: -12 },
      SUPER: { name: "SUPER 🍄+", scale: 1.4, width: 44, height: 60, maxSpeed: 4.2, jumpForce: -13 },
      MEGA: { name: "MEGA ⭐", scale: 1.85, width: 56, height: 76, maxSpeed: 4.0, jumpForce: -14 }
    };

    const SIZE_KEYS = ["MINI", "NORMAL", "SUPER", "MEGA"];

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    let animationId = null;
    let gameState = 'START'; // 'START', 'PLAYING', 'GAMEOVER'
    let score = 0;
    let lives = 3;
    let currentSizeIndex = 1; // Start at NORMAL (index 1)
    let currentTarget = null;
    let targetCooldown = 0;
    let particles = [];
    let clouds = [];
    let hills = [];
    let blocks = [];
    let floatingTexts = [];

    // Screen dimension scaling
    const V_WIDTH = 800;
    const V_HEIGHT = 480;
    const GROUND_Y = 410;

    function resizeCanvas() {
      const rect = canvas.parentElement.getBoundingClientRect();
      canvas.width = rect.width;
      canvas.height = rect.height;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    const mario = {
      x: 100,
      y: GROUND_Y - 44,
      vx: 0,
      vy: 0,
      facing: 1, // 1: right, -1: left
      isGrounded: false,
      isTransforming: false,
      transformTimer: 0,
      walkFrame: 0,
      walkTimer: 0,

      getSizeConfig() {
        return SIZES[SIZE_KEYS[currentSizeIndex]];
      },

      update() {
        const config = this.getSizeConfig();
        const gravity = 0.55;

        // Apply Horizontal Movement
        if (input.left) {
          this.vx = -config.maxSpeed;
          this.facing = -1;
        } else if (input.right) {
          this.vx = config.maxSpeed;
          this.facing = 1;
        } else {
          this.vx *= 0.8;
          if (Math.abs(this.vx) < 0.1) this.vx = 0;
        }

        // Apply Vertical Movement / Jump
        if (input.jump && this.isGrounded) {
          this.vy = config.jumpForce;
          this.isGrounded = false;
          SoundEngine.jump();
        }

        this.vy += gravity;

        // Proposed Next Positions
        this.x += this.vx;
        this.y += this.vy;

        // Stage bounds (Loop or Clamp)
        if (this.x < 10) this.x = 10;
        if (this.x > V_WIDTH - config.width - 10) this.x = V_WIDTH - config.width - 10;

        // Ground Collision
        if (this.y + config.height >= GROUND_Y) {
          this.y = GROUND_Y - config.height;
          this.vy = 0;
          this.isGrounded = true;
        } else {
          this.isGrounded = false;
        }

        // Animation frame updating
        if (Math.abs(this.vx) > 0.5 && this.isGrounded) {
          this.walkTimer++;
          if (this.walkTimer > 6) {
            this.walkFrame = (this.walkFrame + 1) % 3;
            this.walkTimer = 0;
          }
        } else {
          this.walkFrame = 0;
        }

        // Transformation blink timer
        if (this.isTransforming) {
          this.transformTimer--;
          if (this.transformTimer <= 0) {
            this.isTransforming = false;
          }
        }

        // Block Head-Bump Collision Check (when moving UP)
        this.checkBlockCollisions(config);
      },

      checkBlockCollisions(config) {
        for (let block of blocks) {
          // Mario bounding box
          const mx = this.x;
          const my = this.y;
          const mw = config.width;
          const mh = config.height;

          // Block bounding box
          const bx = block.x;
          const by = block.y + block.offsetY;
          const bw = block.w;
          const bh = block.h;

          const overlapX = (mx + mw > bx + 6) && (mx < bx + bw - 6);

          // Headbutt condition: Mario is moving upwards and top of head touches bottom of block
          if (overlapX && this.vy < 0 && my <= by + bh && my >= by + bh - 18) {
            // Rebound Mario
            this.y = by + bh;
            this.vy = 2; // small downward push
            block.hit();
            break;
          }
        }
      },

      draw(c, scaleX, scaleY) {
        c.save();
        c.scale(scaleX, scaleY);

        const config = this.getSizeConfig();
        const cx = this.x + config.width / 2;
        const cy = this.y + config.height / 2;

        c.translate(cx, cy);
        c.scale(this.facing, 1);

        if (this.isTransforming && Math.floor(Date.now() / 60) % 2 === 0) {
          c.globalAlpha = 0.35;
        }

        const w = config.width;
        const h = config.height;

        // Overall Mario silhouette & clothing styling
        // Shoes
        c.fillStyle = "#6B3E08"; // brown shoes
        c.fillRect(-w * 0.45, h * 0.35, w * 0.4, h * 0.15);
        c.fillRect(w * 0.05, h * 0.35, w * 0.4, h * 0.15);

        // Blue Overalls
        c.fillStyle = "#2563EB";
        c.fillRect(-w * 0.4, h * 0.05, w * 0.8, h * 0.35);

        // Red Shirt
        c.fillStyle = "#EF4444";
        c.fillRect(-w * 0.35, -h * 0.18, w * 0.7, h * 0.25);
        // Sleeves
        c.fillRect(-w * 0.48, -h * 0.15, w * 0.2, h * 0.25);
        c.fillRect(w * 0.28, -h * 0.15, w * 0.2, h * 0.25);

        // White Hands / Gloves
        c.fillStyle = "#FFFFFF";
        c.beginPath();
        c.arc(-w * 0.42, h * 0.12, w * 0.12, 0, Math.PI * 2);
        c.arc(w * 0.42, h * 0.12, w * 0.12, 0, Math.PI * 2);
        c.fill();

        // Yellow Overall Buttons
        c.fillStyle = "#FACC15";
        c.fillRect(-w * 0.2, h * 0.08, w * 0.1, h * 0.08);
        c.fillRect(w * 0.1, h * 0.08, w * 0.1, h * 0.08);

        // Peach Face
        c.fillStyle = "#FED7AA";
        c.fillRect(-w * 0.35, -h * 0.42, w * 0.7, h * 0.28);

        // Nose
        c.fillStyle = "#FDBA74";
        c.beginPath();
        c.arc(w * 0.28, -h * 0.3, w * 0.14, 0, Math.PI * 2);
        c.fill();

        // Eye
        c.fillStyle = "#1E293B";
        c.fillRect(w * 0.1, -h * 0.38, w * 0.09, h * 0.12);

        // Mustache (classic Mario mustache)
        c.fillStyle = "#1E293B";
        c.fillRect(-w * 0.05, -h * 0.26, w * 0.42, h * 0.1);
        c.fillRect(w * 0.1, -h * 0.2, w * 0.25, h * 0.07);

        // Red Hat with Visor
        c.fillStyle = "#DC2626";
        c.fillRect(-w * 0.4, -h * 0.52, w * 0.8, h * 0.16);
        c.fillRect(0, -h * 0.45, w * 0.5, h * 0.09); // visor peak

        // Hat Emblem ("M")
        c.fillStyle = "#FFFFFF";
        c.beginPath();
        c.arc(-w * 0.05, -h * 0.45, w * 0.12, 0, Math.PI * 2);
        c.fill();
        c.fillStyle = "#DC2626";
        c.font = `bold ${Math.max(8, h * 0.16)}px sans-serif`;
        c.textAlign = "center";
        c.textBaseline = "middle";
        c.fillText("M", -w * 0.05, -h * 0.44);

        c.restore();
      }
    };

    class WordBlock {
      constructor(x, y, wordObj) {
        this.x = x;
        this.y = y;
        this.w = 120;
        this.h = 60;
        this.wordObj = wordObj; // { en: 'CAT', zh: '貓咪', emoji: '🐱' }
        this.offsetY = 0;
        this.bounceSpeed = 0;
        this.isBouncing = false;
        this.revealed = false;
        this.flashTimer = 0;
        this.highlightColor = null;
      }

      hit() {
        if (this.isBouncing) return;
        this.isBouncing = true;
        this.bounceSpeed = -8;
        SoundEngine.hit();

        // Check answer
        const isCorrect = (this.wordObj.en === currentTarget.en);
        if (isCorrect) {
          this.highlightColor = '#4ADE80'; // Emerald green
          handleCorrectAnswer(this);
        } else {
          this.highlightColor = '#F87171'; // Red
          handleWrongAnswer(this);
        }
      }

      update() {
        if (this.isBouncing) {
          this.offsetY += this.bounceSpeed;
          this.bounceSpeed += 1;
          if (this.offsetY >= 0) {
            this.offsetY = 0;
            this.isBouncing = false;
          }
        }
      }

      draw(c, scaleX, scaleY) {
        c.save();
        c.scale(scaleX, scaleY);

        const bx = this.x;
        const by = this.y + this.offsetY;

        // Block base shadow
        c.fillStyle = "#78350F";
        c.fillRect(bx + 4, by + 4, this.w, this.h);

        // Brick/Question Block Gradient
        const blockGrad = c.createLinearGradient(bx, by, bx, by + this.h);
        if (this.highlightColor) {
          blockGrad.addColorStop(0, this.highlightColor);
          blockGrad.addColorStop(1, '#B91C1C');
        } else {
          blockGrad.addColorStop(0, '#FBBF24');
          blockGrad.addColorStop(0.7, '#D97706');
          blockGrad.addColorStop(1, '#92400E');
        }
        c.fillStyle = blockGrad;
        c.fillRect(bx, by, this.w, this.h);

        // Retro Screws on Corners
        c.fillStyle = "#451A03";
        c.fillRect(bx + 3, by + 3, 4, 4);
        c.fillRect(bx + this.w - 7, by + 3, 4, 4);
        c.fillRect(bx + 3, by + this.h - 7, 4, 4);
        c.fillRect(bx + this.w - 7, by + this.h - 7, 4, 4);

        // Inner Border Highlight
        c.strokeStyle = "#FDE68A";
        c.lineWidth = 2;
        c.strokeRect(bx + 4, by + 4, this.w - 8, this.h - 8);

        // Word Display
        c.fillStyle = "#1E1B4B"; // Dark Navy for great contrast
        c.textAlign = "center";
        c.textBaseline = "middle";

        // Main English word
        c.font = "bold 16px 'Press Start 2P', monospace";
        c.fillText(this.wordObj.en, bx + this.w / 2, by + this.h / 2 - 3);

        // Little hint indicator
        c.font = "12px 'Noto Sans TC', sans-serif";
        c.fillStyle = "#FEF08A";
        c.fillText("❔ 頂我！", bx + this.w / 2, by + this.h - 10);

        c.restore();
      }
    }

    function showToast(text, isPositive = true, icon = "🍄") {
      const banner = document.getElementById('toast-banner');
      const textElem = document.getElementById('toast-text');
      const iconElem = document.getElementById('toast-icon');

      textElem.innerText = text;
      iconElem.innerText = icon;
      banner.className = `absolute top-4 left-1/2 -translate-x-1/2 pointer-events-none transition-all duration-300 z-30 px-5 py-2.5 rounded-full font-bold text-sm shadow-2xl flex items-center gap-2 transform translate-y-0 opacity-100 ${
        isPositive ? 'bg-green-600 text-white border-2 border-yellow-300' : 'bg-red-600 text-white border-2 border-white'
      }`;

      setTimeout(() => {
        banner.classList.add('opacity-0', '-translate-y-4');
      }, 1400);
    }

    function addFloatingText(x, y, text, color) {
      floatingTexts.push({
        x,
        y,
        text,
        color,
        vy: -2,
        opacity: 1,
        life: 40
      });
    }

    function spawnSparks(x, y, color = "#FDE047") {
      for (let i = 0; i < 16; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 4 + 2;
        particles.push({
          x,
          y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          color,
          size: Math.random() * 4 + 3,
          life: 25
        });
      }
    }

    function handleCorrectAnswer(block) {
      score += 150;
      updateScoreUI();
      SoundEngine.powerUp();
      spawnSparks(block.x + block.w / 2, block.y, '#FDE047');
      addFloatingText(block.x + block.w / 2, block.y - 10, "+150 GROW! 🍄", "#4ADE80");

      // Mario grows bigger!
      if (currentSizeIndex < SIZE_KEYS.length - 1) {
        currentSizeIndex++;
        mario.isTransforming = true;
        mario.transformTimer = 25;
        showToast(`答對了！瑪利歐變大 升級為 ${SIZES[SIZE_KEYS[currentSizeIndex]].name}！`, true, "🍄");
      } else {
        showToast(`答對了！已達無敵巨型狀態！+300 分`, true, "⭐");
        score += 150;
        updateScoreUI();
      }

      updateSizeUI();
      resetTargetAndBlocks();
    }

    function handleWrongAnswer(block) {
      SoundEngine.shrink();
      spawnSparks(block.x + block.w / 2, block.y, '#EF4444');
      addFloatingText(block.x + block.w / 2, block.y - 10, "WRONG! SHRINK ⚡", "#F87171");

      // Mario shrinks!
      if (currentSizeIndex > 0) {
        currentSizeIndex--;
        mario.isTransforming = true;
        mario.transformTimer = 25;
        showToast(`答錯了！那是 ${block.wordObj.zh}，瑪利歐縮小了！`, false, "💔");
      } else {
        // Already at MINI size: Lose a life!
        lives--;
        updateLivesUI();
        showToast(`太小了！失去一條愛心！`, false, "💀");
        if (lives <= 0) {
          triggerGameOver();
          return;
        }
      }

      updateSizeUI();
      resetTargetAndBlocks();
    }

    function resetTargetAndBlocks() {
      // Pick a random target animal
      const targetIdx = Math.floor(Math.random() * ANIMAL_WORDS.length);
      currentTarget = ANIMAL_WORDS[targetIdx];

      // Update UI Target Bar
      document.getElementById('target-emoji').innerText = currentTarget.emoji;
      document.getElementById('target-chinese').innerText = `${currentTarget.zh} (${currentTarget.emoji})`;

      // Pick 3 candidate words (1 correct + 2 wrong)
      const wrongCandidates = ANIMAL_WORDS.filter(w => w.en !== currentTarget.en)
        .sort(() => 0.5 - Math.random())
        .slice(0, 2);

      const levelOptions = [currentTarget, ...wrongCandidates].sort(() => 0.5 - Math.random());

      // Create 3 question blocks evenly spaced
      blocks = [];
      const blockWidth = 140;
      const blockSpacing = (V_WIDTH - 3 * blockWidth) / 4;
      const blockY = 220; // Perfect jumping headbutt height!

      for (let i = 0; i < 3; i++) {
        const bx = blockSpacing + i * (blockWidth + blockSpacing);
        const b = new WordBlock(bx, blockY, levelOptions[i]);
        b.w = blockWidth;
        blocks.push(b);
      }
    }

    function updateScoreUI() {
      document.getElementById('score-display').innerText = String(score).padStart(6, '0');
    }

    function updateLivesUI() {
      const heartStr = "❤️".repeat(Math.max(0, lives)) + "🖤".repeat(Math.max(0, 3 - lives));
      document.getElementById('lives-display').innerText = heartStr;
    }

    function updateSizeUI() {
      const sizeLabel = document.getElementById('size-label');
      const current = SIZES[SIZE_KEYS[currentSizeIndex]];
      sizeLabel.innerText = current.name;
    }

    function triggerGameOver() {
      gameState = 'GAMEOVER';
      SoundEngine.gameOver();
      const modal = document.getElementById('overlay-modal');
      const title = document.getElementById('modal-title');
      const subtitle = document.getElementById('modal-subtitle');
      const desc = document.getElementById('modal-desc');
      const btn = document.getElementById('start-btn');

      title.innerText = "GAME OVER";
      title.className = "text-3xl sm:text-4xl text-red-500 pixel-font mb-3 drop-shadow-[0_4px_0_#000]";
      subtitle.innerText = `最終得分: ${score} 分`;
      desc.innerHTML = `瑪利歐縮小過度暈倒了！<br>多練習動物單字，下次一定能變身 MEGA 巨型瑪利歐！`;
      btn.innerText = "PLAY AGAIN 🔄";
      modal.classList.remove('hidden');
    }

    function initScenery() {
      clouds = [
        { x: 50, y: 50, s: 1.2, speed: 0.3 },
        { x: 320, y: 90, s: 0.8, speed: 0.2 },
        { x: 600, y: 40, s: 1.0, speed: 0.25 },
        { x: 780, y: 110, s: 0.7, speed: 0.15 }
      ];

      hills = [
        { x: 80, y: GROUND_Y, r: 80, color: '#16A34A' },
        { x: 420, y: GROUND_Y, r: 130, color: '#15803D' },
        { x: 700, y: GROUND_Y, r: 70, color: '#16A34A' }
      ];
    }

    function drawEnvironment(c, scaleX, scaleY) {
      c.save();
      c.scale(scaleX, scaleY);

      // Sky gradient
      const skyGrad = c.createLinearGradient(0, 0, 0, GROUND_Y);
      skyGrad.addColorStop(0, '#38BDF8');
      skyGrad.addColorStop(1, '#BAE6FD');
      c.fillStyle = skyGrad;
      c.fillRect(0, 0, V_WIDTH, V_HEIGHT);

      // Draw Clouds
      c.fillStyle = "#FFFFFF";
      for (let cl of clouds) {
        cl.x += cl.speed;
        if (cl.x > V_WIDTH + 100) cl.x = -100;

        c.beginPath();
        c.arc(cl.x, cl.y, 20 * cl.s, 0, Math.PI * 2);
        c.arc(cl.x + 25 * cl.s, cl.y - 10 * cl.s, 26 * cl.s, 0, Math.PI * 2);
        c.arc(cl.x + 55 * cl.s, cl.y, 22 * cl.s, 0, Math.PI * 2);
        c.fill();
      }

      // Draw Hills
      for (let h of hills) {
        c.fillStyle = h.color;
        c.beginPath();
        c.arc(h.x, h.y, h.r, Math.PI, 0);
        c.fill();
        c.strokeStyle = '#14532D';
        c.lineWidth = 3;
        c.stroke();
      }

      // Draw Classic Green Pipe (Side Decor)
      drawPipe(c, 20, GROUND_Y - 70, 60, 70);
      drawPipe(c, V_WIDTH - 80, GROUND_Y - 90, 60, 90);

      // Draw Ground (Checkered Mario Grass + Dirt)
      c.fillStyle = "#15803D"; // Top Grass
      c.fillRect(0, GROUND_Y, V_WIDTH, 14);

      c.fillStyle = "#D97706"; // Underground dirt
      c.fillRect(0, GROUND_Y + 14, V_WIDTH, V_HEIGHT - GROUND_Y - 14);

      // Dirt brick pattern
      c.strokeStyle = "#92400E";
      c.lineWidth = 2;
      for (let gx = 0; gx < V_WIDTH; gx += 32) {
        for (let gy = GROUND_Y + 14; gy < V_HEIGHT; gy += 18) {
          c.strokeRect(gx, gy, 32, 18);
        }
      }

      c.restore();
    }

    function drawPipe(c, x, y, w, h) {
      // Pipe Rim
      const rimH = 22;
      const rimOverlap = 5;
      c.fillStyle = "#22C55E";
      c.fillRect(x - rimOverlap, y, w + rimOverlap * 2, rimH);
      c.strokeStyle = "#14532D";
      c.lineWidth = 3;
      c.strokeRect(x - rimOverlap, y, w + rimOverlap * 2, rimH);

      // Pipe Body
      c.fillStyle = "#16A34A";
      c.fillRect(x, y + rimH, w, h - rimH);
      c.strokeRect(x, y + rimH, w, h - rimH);

      // Pipe Highlight
      c.fillStyle = "rgba(255, 255, 255, 0.3)";
      c.fillRect(x + 6, y, 6, h);
    }

    const input = { left: false, right: false, jump: false };

    window.addEventListener('keydown', (e) => {
      SoundEngine.init();
      if (e.code === 'ArrowLeft' || e.code === 'KeyA') {
        input.left = true;
      }
      if (e.code === 'ArrowRight' || e.code === 'KeyD') {
        input.right = true;
      }
      if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') {
        input.jump = true;
      }
    });

    window.addEventListener('keyup', (e) => {
      if (e.code === 'ArrowLeft' || e.code === 'KeyA') {
        input.left = false;
      }
      if (e.code === 'ArrowRight' || e.code === 'KeyD') {
        input.right = false;
      }
      if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') {
        input.jump = false;
      }
    });

    // Touch controls binding
    function bindTouchButton(elemId, key) {
      const el = document.getElementById(elemId);
      if (!el) return;
      const activate = (ev) => {
        ev.preventDefault();
        SoundEngine.init();
        input[key] = true;
      };
      const deactivate = (ev) => {
        ev.preventDefault();
        input[key] = false;
      };
      el.addEventListener('touchstart', activate, { passive: false });
      el.addEventListener('touchend', deactivate, { passive: false });
      el.addEventListener('mousedown', activate);
      el.addEventListener('mouseup', deactivate);
      el.addEventListener('mouseleave', deactivate);
    }

    bindTouchButton('btn-left', 'left');
    bindTouchButton('btn-right', 'right');
    bindTouchButton('btn-jump', 'jump');

    function gameLoop() {
      // Calculate scaling factor between Virtual Canvas (800x480) and actual Canvas
      const scaleX = canvas.width / V_WIDTH;
      const scaleY = canvas.height / V_HEIGHT;

      // Clear & Draw World
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      drawEnvironment(ctx, scaleX, scaleY);

      if (gameState === 'PLAYING') {
        mario.update();

        // Update Blocks
        for (let b of blocks) {
          b.update();
        }

        // Update Floating particles
        for (let i = particles.length - 1; i >= 0; i--) {
          const p = particles[i];
          p.x += p.vx;
          p.y += p.vy;
          p.vy += 0.2;
          p.life--;
          if (p.life <= 0) particles.splice(i, 1);
        }

        // Update Floating text
        for (let i = floatingTexts.length - 1; i >= 0; i--) {
          const ft = floatingTexts[i];
          ft.y += ft.vy;
          ft.life--;
          ft.opacity = ft.life / 40;
          if (ft.life <= 0) floatingTexts.splice(i, 1);
        }
      }

      // Draw Question Blocks
      for (let b of blocks) {
        b.draw(ctx, scaleX, scaleY);
      }

      // Draw Mario
      mario.draw(ctx, scaleX, scaleY);

      // Draw Particles
      ctx.save();
      ctx.scale(scaleX, scaleY);
      for (let p of particles) {
        ctx.fillStyle = p.color;
        ctx.fillRect(p.x, p.y, p.size, p.size);
      }

      // Draw Floating Texts
      for (let ft of floatingTexts) {
        ctx.save();
        ctx.globalAlpha = Math.max(0, ft.opacity);
        ctx.fillStyle = ft.color;
        ctx.font = "bold 15px 'Press Start 2P', monospace";
        ctx.textAlign = "center";
        ctx.shadowColor = "#000";
        ctx.shadowBlur = 4;
        ctx.fillText(ft.text, ft.x, ft.y);
        ctx.restore();
      }
      ctx.restore();

      animationId = requestAnimationFrame(gameLoop);
    }

    function startGame() {
      SoundEngine.init();
      score = 0;
      lives = 3;
      currentSizeIndex = 1; // Start Normal
      mario.x = 80;
      mario.y = GROUND_Y - 44;
      mario.vx = 0;
      mario.vy = 0;
      mario.isTransforming = false;

      updateScoreUI();
      updateLivesUI();
      updateSizeUI();
      initScenery();
      resetTargetAndBlocks();

      document.getElementById('overlay-modal').classList.add('hidden');
      gameState = 'PLAYING';
    }

    document.getElementById('start-btn').addEventListener('click', () => {
      startGame();
    });

    // Run game engine on load
    window.onload = function () {
      initScenery();
      resetTargetAndBlocks();
      gameLoop();
    };
  </script>
</body>
</html>
